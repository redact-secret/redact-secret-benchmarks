name: Research a provider or family
description: For experienced researchers and maintainers. Track a provider's secret family where a benchmarks dossier is still required. Closed only by the dossier PR that records the verdict.
title: "research(<provider>): <family>"
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        **Who this form is for.** Experienced research contributors, maintainer-created research
        tasks, and dossier-ready work, where you can fill the dossier fields below. New to this,
        or only know that a provider or credential exists? Do not use this form; a maintainer
        opens this form's issue when warranted (routing in
        [`docs/research-intake.md`](https://github.com/redact-secret/redact-secret-benchmarks/blob/main/docs/research-intake.md)).

        **Synthetic only, no live credentials.** Never paste a real, live, unrevoked or newly
        generated secret. Describe shapes in words or as a grammar; examples must be synthetic.

        **Tooling.** Scaffold the taxonomy entry, dossier entry and inert fixture stub with
        `npm run family:new -- <provider> <family>` and check progress with
        `npm run family:status`. The dossier schema is
        [`schemas/dossier-v1.json`](https://github.com/redact-secret/redact-secret-benchmarks/blob/main/schemas/dossier-v1.json).

        **Where this fits.** The current order is: credential-evidence research, then core
        adoption (core's adoption comment, the only place `implementation-ready` is applied),
        then independent evaluation, then the benchmarks report. A benchmarks dossier is a
        legacy source: it is still required only where core's
        [new-detector-family checklist](https://github.com/redact-secret/redact-secret/blob/main/CONTRIBUTION.md#new-detector-family-checklist)
        names it as the consumer of the research verdict. Otherwise open the research in
        credential-evidence, not here.

        **Completion rule.** A dossier research issue is closed only by a pull request that adds or updates
        `benchmarks/support/dossiers/<provider>.md` and carries `Closes #N` for this issue. That
        includes a `not-found` or `rejected` verdict. Do not close it by hand. Iterative findings
        stay in comments; the dossier links them by permalink.

        The fields below mirror the dossier frontmatter (`schemas/dossier-v1.json`). Describe a
        token shape in words or as a grammar. Never paste a real, live or new secret-shaped value.
  - type: input
    id: provider
    attributes:
      label: provider
      description: taxonomy.json provider id (lowercase, hyphenated), or `generic` for provider-less families.
    validations:
      required: true
  - type: textarea
    id: families
    attributes:
      label: families
      description: One family id per line as `<provider>:<family>`, existing in taxonomy.json or proposed.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: verdict
      description: Expected verdict. The dossier PR records the final one.
      options:
        - unresearched
        - ready
        - issuance-gated
        - date-gated
        - not-found
        - rejected
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: tier
      description: Evidence tier expected. Use `null` while unresearched.
      options:
        - "null"
        - T0
        - T1
        - T2
        - T3
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: sources
      description: https URLs to provider docs, SDK or generator code backing the grammar. One per line; GitHub links must be commit permalinks.
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: issues
      description: Related research issues as `owner/repo#N`, one per line. Add this issue once it has a number.
  - type: input
    id: evidence
    attributes:
      label: evidence
      description: GitHub blob or tree link pinned to a 40-hex commit, if final evidence for a past state exists. Otherwise leave empty.
  - type: input
    id: researchedAt
    attributes:
      label: researchedAt
      description: YYYY-MM-DD of the latest verdict. Leave empty while unresearched.
  - type: input
    id: blockedBy
    attributes:
      label: blockedBy
      description: One line on what stops the next stage. Required for issuance-gated and date-gated (for example, whether a revoked sample can be minted and what plan or cost that needs).
  - type: textarea
    id: grammar
    attributes:
      label: Observed prefix and grammar, in words
      description: Prose only, for the dossier body. No real token values.
  - type: checkboxes
    id: credential-attestation
    attributes:
      label: Credential check
      options:
        - label: I did not paste any real or unrevoked credential
          required: true
