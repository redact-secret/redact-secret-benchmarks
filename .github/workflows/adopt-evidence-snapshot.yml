name: Adopt evidence snapshot
# Maintainer-dispatched intake of a published credential-evidence snapshot (#690). It verifies the immutable release assets and that
# the pinned engine can read the snapshot BEFORE anything changes; an incompatible or unverifiable snapshot fails here with a report
# and opens no pull request. A ready snapshot becomes a draft PR into develop that records a CANDIDATE and the change report only:
# active pins, official runs and the authority file are never edited here, and no owner acceptance is written. Replay, acceptance,
# staging, production and rollback are in docs/specs/evidence-adoption.md. Manual only; releasing a snapshot stays manual.
#
# Safety: dispatch only (never pull_request_target); inputs reach the shell only through env and are pattern-checked first; the
# preflight job is contents: read; the propose job alone gets contents/pull-requests: write, and only after the preflight passed;
# the engine token is a GitHub App token for credential-eval with contents: read; one run at a time; no step echoes a secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Evidence release tag, for example snapshot-2026.10.03
        required: true
        type: string
      manifest_digest:
        description: Expected sha256 of release-manifest.json, sha256:<64 hex> (from the release notes / release:verify)
        required: true
        type: string
permissions: {}
concurrency:
  group: adopt-evidence-snapshot
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release and the engine's ability to read it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      branch: ${{ steps.prepare.outputs.branch }}
      key: ${{ steps.prepare.outputs.key }}
    env:
      TAG: ${{ inputs.tag }}
      MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
    steps:
      - name: Inputs are well-formed
        run: |
          [[ "$TAG" =~ ^snapshot-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::tag must look like snapshot-YYYY.MM.DD[.N]"; exit 1; }
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::manifest_digest must be sha256:<64 lowercase hex>"; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read the engine pin
        id: engine
        run: echo "tag=$(node -p "require('./benchmarks/official-runs.json').engine.tag")" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for the engine repository
        id: engine-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CREDENTIAL_EVAL_APP_ID }}
          private-key: ${{ secrets.CREDENTIAL_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: credential-eval
          permission-contents: read
      - name: Fetch the engine's own corpus-snapshot contract at the pinned tag
        env:
          GH_TOKEN: ${{ steps.engine-token.outputs.token }}
          ENGINE_TAG: ${{ steps.engine.outputs.tag }}
        run: >
          gh api -H 'Accept: application/vnd.github.raw'
          "repos/redact-secret/credential-eval/contents/schemas/corpus-snapshot-v1.schema.json?ref=${ENGINE_TAG}"
          > "$RUNNER_TEMP/engine-corpus-snapshot-schema.json"
      - name: Verify, check engine compatibility, prepare the candidate and change report
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p adoption-out
          node scripts/adopt-evidence-snapshot.mjs prepare --tag "$TAG" --manifest-digest "$MANIFEST_DIGEST" \
            --dir "$RUNNER_TEMP/adopt-new" --previous-dir "$RUNNER_TEMP/adopt-previous" \
            --engine-schema "$RUNNER_TEMP/engine-corpus-snapshot-schema.json" \
            --out "$RUNNER_TEMP/preflight-report.json" --summary adoption-out/summary.md 2> "$RUNNER_TEMP/preflight.err"
          code=$?
          set -e
          {
            echo "### Evidence adoption: ${TAG}"
            if [ -f adoption-out/summary.md ]; then cat adoption-out/summary.md; fi
            if [ -s "$RUNNER_TEMP/preflight.err" ]; then echo; echo '```'; cat "$RUNNER_TEMP/preflight.err"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error title=Evidence adoption stopped::exit ${code} (3 identity or digest failure, 4 engine incompatibility, 5 conflicting adoption); no pin changed and no pull request opened. See the job summary."
            exit "$code"
          fi
      - name: Keep the candidate files for the proposal job
        if: steps.prepare.outputs.outcome == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoption-candidate
          path: |
            benchmarks/evidence-adoption.json
            docs/generated/evidence-adoption/*.json
            adoption-out/summary.md
          if-no-files-found: error
          retention-days: 14

  propose:
    name: Open the draft adoption pull request (once per snapshot and pins)
    needs: preflight
    if: needs.preflight.outputs.outcome == 'ready' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.tag }}
      BRANCH: ${{ needs.preflight.outputs.branch }}
      KEY: ${{ needs.preflight.outputs.key }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adoption-candidate
          path: ${{ runner.temp }}/candidate
      - name: Skip when this adoption already has a branch or an open pull request
        id: existing
        run: |
          [[ "$BRANCH" =~ ^adopt-evidence/snapshot-[0-9.]+-[0-9a-f]{12}$ ]] || { echo "::error::unexpected branch name"; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Branch ${BRANCH} already exists; no duplicate pull request."; exit 0; fi
          if [ -n "$(gh pr list --state open --search "head:${BRANCH}" --json number -q '.[].number')" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Commit the candidate record and change report, push the branch and open a draft pull request
        if: steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          cp "$RUNNER_TEMP/candidate/benchmarks/evidence-adoption.json" benchmarks/evidence-adoption.json
          mkdir -p docs/generated/evidence-adoption
          cp "$RUNNER_TEMP"/candidate/docs/generated/evidence-adoption/*.json docs/generated/evidence-adoption/
          git add benchmarks/evidence-adoption.json docs/generated/evidence-adoption
          git commit -m "chore(evidence): record adoption candidate ${TAG} (${KEY:0:12})"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:refs/heads/${BRANCH}"
          {
            cat "$RUNNER_TEMP/candidate/adoption-out/summary.md"
            echo
            echo "This draft records a candidate only. Active pins, official runs and the authority file are unchanged, so the gates stay green and the old public numbers stay in force. Next: docs/specs/evidence-adoption.md (replay, owner acceptance, staging, production)."
            echo "A pull request opened with the workflow token does not start the repository checks: push an empty commit or close and reopen it to run them."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --draft --base develop --head "$BRANCH" --title "chore(evidence): adoption candidate ${TAG}" --body-file "$RUNNER_TEMP/pr-body.md"
