name: Official credential-eval runs
# Runs credential-eval officially, once per qualification population (#604), and builds the qualification view from the
# artifacts (#605). The floors population is run twice: a plain measurement and a methods run (#636). Manual only: it
# builds a private engine and runs five scanners, so it is never part of push or pull request validation. The pins are
# benchmarks/official-runs.json; the steps are credential-eval docs/consumers/benchmarks-quickstart.md.
# Spec: docs/specs/official-runs.md.
#
# Two modes (#705). `full` (the default) is the official run described above. `diagnostic` is the fast product-candidate lane: it runs only the
# product scanner over the regression and policy populations (the public population too only with include_public), as an EXPLORATORY, internal
# run, one engine run per population, no methods, no peers; each population job uploads its findings and outcome receipt as soon as it ends, and
# the summary states which scanners and methods did not run. Diagnostic artifacts are named diagnostic-<population>, are never read by the
# qualification-view job, never recorded or archived, and cannot pass the official binding. Spec: docs/specs/official-runs.md, "The diagnostic lane".
#
# Stage receipts and retry (#762). Every completed stage (plain, methods) of a population is uploaded as its own artifact the moment it ends
# (stage-plain-<population>, stage-methods-<population>, 14 days), with stage-receipt.json naming the stage, population, engine/config/evidence identity and the
# digests of its bytes. `retry_run_id` resolves each stage from stage-*, early-plain-* or the job-end official-run-* artifact of the earlier run and reuses it only
# when the driver finds the IDENTICAL identity (never a mix). A failure or cancel after the engine finished keeps the output and marks the stage INCOMPLETE
# (stage-incomplete.json, never a success, never reused). `populations` + `rehearse_post_step_failure` rehearse that on the cheap populations only.
#
# Safety: dispatch only (never pull_request_target); contents: read; the engine token is a GitHub App token scoped to
# redact-secret/credential-eval with contents: read, minted in the job that needs it and never echoed; no checkout keeps
# credentials; every action is pinned to a commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: full = the official run (all populations, all scanners, two engine runs, methods, the qualification view). diagnostic = the fast product-candidate lane (#705); exploratory and internal, never promotable.
        required: false
        default: full
        type: choice
        options: [full, diagnostic]
      include_public:
        description: Diagnostic mode only. Also run the public evidence population for the product (a separate job; it never delays the regression and policy receipts).
        required: false
        default: false
        type: boolean
      populations:
        description: STAGE REHEARSAL only (#762). A comma-separated subset of regression-corpus,policy-corpus, to rehearse the stage receipts and the retry on the cheap populations without any public/OpenRedaction measurement. Never an official run (no view is built); refused with attribution, candidate, reuse_run_id and diagnostic mode, and never names the public population.
        required: false
        default: ''
        type: string
      rehearse_post_step_failure:
        description: Stage rehearsal only (#762). Fail the job on purpose after the plain stage was measured, verified and uploaded, to prove that a retry (retry_run_id) reuses the finished stage. Needs `populations`.
        required: false
        default: false
        type: boolean
      omit_optional:
        description: Leave an OPTIONAL scanner of the evaluation contract out of the official run (#763, benchmarks/support/scanner-roster.json), for example openredaction (its default profile is a manual measurement). The run is complete without it and the view says it was not measured. Needs an engine release that ships the without-optional configuration; refused otherwise. Exclusive with diagnostic mode, attribution and candidate.
        required: false
        default: ''
        type: string
      reuse_run_id:
        description: Retry the view stage only (#699). The id of an earlier official-runs run whose scanner artifacts are valid; the scanner jobs are skipped and the view is built from that run's artifacts and the pinned snapshot of this commit.
        required: false
        default: ''
        type: string
      attribution:
        description: Make an ATTRIBUTION run (#697) of the registry's attributionRuns entry (for example core-beta.12, the previous product release on the same engine and evidence). The scanner jobs upload artifacts named attribution-<id>-<population>; the view stage is skipped, because an attribution run is never the accepted one.
        required: false
        default: ''
        type: string
      candidate:
        description: Measure a registered UNPUBLISHED product build (an id in benchmarks/product-candidates.json, for example core-main-1e45cecf) on the adoption's engine candidate instead of an official run (#698). Exploratory and internal, never an accepted run; builds the effect report against the engine candidate's control; the artifacts are archived by scripts/run-candidate-replay.mjs (this workflow stays read-only). Spec docs/specs/product-candidate-replay.md.
        required: false
        default: ''
        type: string
      retry_run_id:
        description: Retry a failed official or attribution run (#707). The id of an earlier official-runs run of this workflow; each population stage that succeeded there (a plain run, a methods run) reuses its artifact as a receipt instead of repeating the engine runs, after it is verified against the pins of this commit and the same inputs; a stage that failed or is not compatible measures fresh. Exclusive with the other reuse inputs and with diagnostic mode.
        required: false
        default: ''
        type: string
      reuse_candidate_run_id:
        description: Retry the effect report of a candidate replay only (#698). The id of an earlier official-runs run with the same `candidate` whose scanner jobs succeeded; the scanner jobs are skipped and the report is built from that run's candidate-run-* artifacts (and the control of the adoption record). Requires `candidate`; exclusive with reuse_run_id and attribution.
        required: false
        default: ''
        type: string
      evidence_tag:
        description: With `candidate`, measure a NEW evidence snapshot (for example snapshot-2026.10.20) instead of the accepted one (#698). The same registered product bytes on that release of credential-evidence; the control is that adoption's recorded replay of the published build. Needs evidence_manifest_digest.
        required: false
        default: ''
        type: string
      evidence_manifest_digest:
        description: The expected sha256 of the evidence_tag release-manifest.json, sha256:<64 hex> (from the release notes / release:verify).
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: official-runs
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the populations (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      populations: ${{ steps.plan.outputs.populations }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
    env:
      POPULATIONS: ${{ inputs.populations }}
      REHEARSE_FAILURE: ${{ inputs.rehearse_post_step_failure }}
      OMIT_OPTIONAL: ${{ inputs.omit_optional }}
      MODE: ${{ inputs.mode }}
      INCLUDE_PUBLIC: ${{ inputs.include_public }}
      ATTRIBUTION: ${{ inputs.attribution }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
      CANDIDATE: ${{ inputs.candidate }}
      REUSE_CANDIDATE_RUN_ID: ${{ inputs.reuse_candidate_run_id }}
      RETRY_RUN_ID: ${{ inputs.retry_run_id }}
    steps:
      - id: plan
        run: |
          if [ -n "$RETRY_RUN_ID" ]; then
            [[ "$RETRY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::retry_run_id must be a run id"; exit 1; }
            [ -z "$REUSE_RUN_ID" ] && [ -z "$REUSE_CANDIDATE_RUN_ID" ] && [ "$MODE" != "diagnostic" ] || { echo "::error::retry_run_id is exclusive with reuse_run_id, reuse_candidate_run_id and diagnostic mode"; exit 1; }
          fi
          echo "rehearsal=false" >> "$GITHUB_OUTPUT"
          if [ -n "$OMIT_OPTIONAL" ]; then
            [[ "$OMIT_OPTIONAL" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::omit_optional must be a scanner id"; exit 1; }
            [ "$MODE" != "diagnostic" ] && [ -z "$ATTRIBUTION" ] && [ -z "$CANDIDATE" ] || { echo "::error::omit_optional is exclusive with diagnostic mode, attribution and candidate"; exit 1; }
          fi
          if [ "$REHEARSE_FAILURE" = "true" ] && [ -z "$POPULATIONS" ]; then echo "::error::rehearse_post_step_failure needs populations (a stage rehearsal)"; exit 1; fi
          if [ -n "$POPULATIONS" ]; then
            [ "$MODE" != "diagnostic" ] && [ "$INCLUDE_PUBLIC" != "true" ] && [ -z "$ATTRIBUTION" ] && [ -z "$CANDIDATE" ] && [ -z "$REUSE_RUN_ID" ] && [ -z "$REUSE_CANDIDATE_RUN_ID" ] || { echo "::error::populations (a stage rehearsal) is exclusive with diagnostic mode, attribution, candidate and the reuse inputs"; exit 1; }
            [[ "$POPULATIONS" =~ ^(regression-corpus|policy-corpus)(,(regression-corpus|policy-corpus))?$ ]] || { echo "::error::populations must be regression-corpus and/or policy-corpus: a rehearsal never runs the public population"; exit 1; }
            list=$(node -p "[...new Set(process.env.POPULATIONS.split(','))].map(p=>JSON.stringify(p)).join(',')")
            echo "populations=[$list]" >> "$GITHUB_OUTPUT"
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGE REHEARSAL of $POPULATIONS: not an official run; no qualification view is built"
            exit 0
          fi
          if [ "$MODE" = "diagnostic" ]; then
            [ -z "$ATTRIBUTION" ] && [ -z "$REUSE_RUN_ID" ] || { echo "::error::a diagnostic run takes neither attribution nor reuse_run_id"; exit 1; }
            [ -z "$CANDIDATE" ] && [ -z "$REUSE_CANDIDATE_RUN_ID" ] || { echo "::error::a diagnostic run (product only, #705) is not a candidate replay (all scanners against the control, #698): use one input set"; exit 1; }
            if [ "$INCLUDE_PUBLIC" = "true" ]; then echo 'populations=["regression-corpus","policy-corpus","public-evidence-snapshot"]' >> "$GITHUB_OUTPUT"; else echo 'populations=["regression-corpus","policy-corpus"]' >> "$GITHUB_OUTPUT"; fi
          else
            [ "$INCLUDE_PUBLIC" != "true" ] || { echo "::error::include_public is for diagnostic mode; a full run always runs every population"; exit 1; }
            echo 'populations=["public-evidence-snapshot","regression-corpus","policy-corpus"]' >> "$GITHUB_OUTPUT"
          fi

  official-run:
    name: ${{ inputs.mode == 'diagnostic' && 'Diagnostic run' || 'Official run' }} (${{ matrix.population }})
    needs: plan
    if: ${{ inputs.reuse_run_id == '' && inputs.reuse_candidate_run_id == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the receipts of a retried run (#707)
    timeout-minutes: 180 # two plain and two methods runs; OpenRedaction's methods scan alone takes ~29 min of its 30-min per-scan limit (credential-eval ADR 0004)
    strategy:
      fail-fast: false
      matrix:
        population: ${{ fromJSON(needs.plan.outputs.populations) }}
    env:
      PLATFORM: linux-x64
      MODE: ${{ inputs.mode }}
      ATTRIBUTION: ${{ inputs.attribution }}
      CANDIDATE: ${{ inputs.candidate }}
      EVIDENCE_TAG: ${{ inputs.evidence_tag }}
      EVIDENCE_DIGEST: ${{ inputs.evidence_manifest_digest }}
      OMIT_OPTIONAL: ${{ inputs.omit_optional }}
    steps:
      - name: Name the stage-timing file (the runner context is not available in job-level env)
        run: echo "STAGE_TIMINGS=$RUNNER_TEMP/stage-timings.tsv" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A new evidence snapshot is named completely, for a candidate only, and its adoption record holds the control
        if: ${{ inputs.evidence_tag != '' || inputs.evidence_manifest_digest != '' }}
        run: |
          [ -n "$CANDIDATE" ] || { echo "::error::evidence_tag measures a product candidate: name one"; exit 1; }
          [[ "$EVIDENCE_TAG" =~ ^snapshot-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::evidence_tag must be a snapshot tag"; exit 1; }
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::evidence_manifest_digest must be sha256:<64 hex>"; exit 1; }
          node scripts/candidate-control.mjs --evidence-tag "$EVIDENCE_TAG" --manifest-digest "$EVIDENCE_DIGEST" --field engine.tag
      - name: A candidate is registered and unpublished, its release holds the registered bytes, and it is not an attribution run
        if: ${{ inputs.candidate != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "::error::candidate must be a registered id"; exit 1; }
          [ -z "$ATTRIBUTION" ] || { echo "::error::attribution and candidate are exclusive"; exit 1; }
          node scripts/check-product-candidates.mjs --bindings
          node -e "const r=require('./benchmarks/product-candidates.json'); if(!r.candidates.some(c=>c.id===process.env.CANDIDATE)){console.error('no such candidate');process.exit(1)}"
      - name: The registry is consistent and each product corpus still matches its pin
        run: npm run official-runs:check -- --bindings

      - name: Read the engine pin
        id: engine
        run: |
          echo "tag=$(if [ -n "$CANDIDATE" ]; then node scripts/candidate-control.mjs ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --manifest-digest "$EVIDENCE_DIGEST"} --field engine.tag; else node -p "require('./benchmarks/official-runs.json').engine.tag"; fi)" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for the engine repository
        id: engine-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CREDENTIAL_EVAL_APP_ID }}
          private-key: ${{ secrets.CREDENTIAL_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: credential-eval
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redact-secret/credential-eval
          ref: ${{ steps.engine.outputs.tag }}
          token: ${{ steps.engine-token.outputs.token }}
          path: credential-eval
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Restore the engine build cache
        id: engine-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # The key binds the engine revision (the tag's commit), the lockfile, the toolchain, the target and the profile; a hit only
        # saves dependency compilation, and cargo still rebuilds anything that differs. The version and revision checks stay in the driver.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            credential-eval/target/release
          key: engine-build-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('credential-eval/Cargo.lock', 'credential-eval/rust-toolchain*') }}-${{ steps.engine.outputs.tag }}
      - name: Build the engine at the pinned tag
        run: scripts/ci-stage.sh "engine build (cache ${{ steps.engine-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }})" -- cargo build --release --locked -p credential-eval-cli --manifest-path credential-eval/Cargo.toml
      - name: Provision the peer scanners at their pinned digests
        if: ${{ inputs.mode != 'diagnostic' }} # the diagnostic lane runs the product only; no peer is needed or waited for
        run: |
          scripts/ci-stage.sh "peer provisioning" -- node scripts/provision-official-peers.mjs --platform "$PLATFORM" --out "$RUNNER_TEMP/peer-bin"
          echo "$RUNNER_TEMP/peer-bin" >> "$GITHUB_PATH"
      - name: Read the Node shim directory (the attribution run's own, when one is made)
        id: shim
        run: |
          [[ -z "$ATTRIBUTION" || "$ATTRIBUTION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "attribution must be an id such as core-beta.12"; exit 1; }
          echo "dir=$(if [ -n "$ATTRIBUTION" ]; then node -p "require('./benchmarks/official-runs.json').attributionRuns['$ATTRIBUTION'].nodeDir"; else echo adapters/node; fi)" >> "$GITHUB_OUTPUT"
      - name: Install the npm scanners from the engine lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: credential-eval/${{ steps.shim.outputs.dir }}
      - name: Find the stages the retried run left behind and download them (#707, #762)
        id: receipts
        if: ${{ inputs.retry_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
        run: node scripts/retry-receipts.mjs --run "$RETRY_RUN_ID" --population "$POPULATION" --out receipts-in ${ATTRIBUTION:+--attribution "$ATTRIBUTION"} ${CANDIDATE:+--candidate} | tee -a "$GITHUB_OUTPUT"
      - name: Diagnostic run (product only, exploratory and internal)
        if: ${{ inputs.mode == 'diagnostic' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
        run: >
          scripts/ci-stage.sh "diagnostic run" -- node --import tsx scripts/run-official-credential-eval.ts
          --mode diagnostic --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION"
      - name: Diagnostic scope and outcomes
        if: ${{ inputs.mode == 'diagnostic' && !cancelled() }}
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          if [ -f "official-out/$POPULATION/diagnostic-summary.md" ]; then cat "official-out/$POPULATION/diagnostic-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Official run, twice, with the determinism check
        id: plain
        if: ${{ inputs.mode != 'diagnostic' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
          RECEIPT: ${{ steps.receipts.outputs.plain == 'reuse' && steps.receipts.outputs.plain_dirs || '' }}
        run: >
          scripts/ci-stage.sh "plain run (2 repeats)" -- node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 ${RECEIPT:+--reuse-receipt "$RECEIPT"} ${OMIT_OPTIONAL:+--omit-optional "$OMIT_OPTIONAL"} ${ATTRIBUTION:+--attribution "$ATTRIBUTION"} ${CANDIDATE:+--candidate "$CANDIDATE" ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --evidence-manifest-digest "$EVIDENCE_DIGEST"}}
      - name: Write the plain stage receipt (the stage is verified and finished)
        id: plain-receipt
        if: ${{ !cancelled() && steps.plain.outcome == 'success' }}
        # The plain evidence is reviewable and reusable the moment it exists, before any slow methods run. It is never an input of the qualification
        # view (which reads official-run-* only) and never replaces the final upload below. The byte copies the checks made are not part of the stage.
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          rm -f "official-out/$POPULATION"/artifact-[0-9]*.json
          node scripts/stage-receipts.mjs write --stage plain --dir "official-out/$POPULATION" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.plain-receipt.outcome == 'success' }}
        with:
          name: stage-plain-${{ inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || '' }}${{ matrix.population }}
          path: |
            official-out/${{ matrix.population }}
            !official-out/${{ matrix.population }}/methods
          if-no-files-found: error
          retention-days: 14
      - name: Rehearsal, fail on purpose after the plain stage was finished and uploaded (#762)
        if: ${{ inputs.rehearse_post_step_failure && steps.plain-receipt.outcome == 'success' && steps.receipts.outputs.plain != 'reuse' }}
        run: |
          echo "::error::REHEARSAL: failing after the plain stage of $POPULATION was finished and uploaded as stage-plain-$POPULATION; retry with retry_run_id=$GITHUB_RUN_ID to see it reused"
          exit 1
        env:
          POPULATION: ${{ matrix.population }}
      - name: Methods run, twice, with the determinism check (floors population only)
        id: methods
        if: matrix.population == 'public-evidence-snapshot' && inputs.mode != 'diagnostic'
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
          NODE_OPTIONS: --max-old-space-size=5120
          RECEIPT: ${{ steps.receipts.outputs.methods == 'reuse' && steps.receipts.outputs.methods_dirs || '' }}
        run: >
          scripts/ci-stage.sh "methods run (2 repeats)" -- node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 --methods ${RECEIPT:+--reuse-receipt "$RECEIPT"} ${OMIT_OPTIONAL:+--omit-optional "$OMIT_OPTIONAL"} ${CANDIDATE:+--jobs 2} ${ATTRIBUTION:+--attribution "$ATTRIBUTION"} ${CANDIDATE:+--candidate "$CANDIDATE" ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --evidence-manifest-digest "$EVIDENCE_DIGEST"}}
      - name: Write the methods stage receipt (the stage is verified and finished)
        id: methods-receipt
        if: ${{ !cancelled() && steps.methods.outcome == 'success' }}
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          rm -f "official-out/$POPULATION/methods"/artifact-[0-9]*.json
          node scripts/stage-receipts.mjs write --stage methods --dir "official-out/$POPULATION/methods" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.methods-receipt.outcome == 'success' }}
        with:
          name: stage-methods-${{ inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || '' }}${{ matrix.population }}
          path: official-out/${{ matrix.population }}/methods
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Say plainly which stages are INCOMPLETE (engine output finished, verification did not)
        if: ${{ always() }}
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          for marker in "official-out/$POPULATION/stage-incomplete.json" "official-out/$POPULATION/methods/stage-incomplete.json"; do
            [ -f "$marker" ] || continue
            msg="INCOMPLETE: $(node -p "const m=require('./$marker'); m.stage+' stage of '+m.population+': '+m.reason")"
            echo "::error::$msg. The engine output is kept in this job's artifact (official-run-$POPULATION); the run is not a success and the stage is not reused."
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Job summary with per-stage timings and the artifacts this job uploads
        if: ${{ !cancelled() }}
        env:
          POPULATION: ${{ matrix.population }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          PLAIN_RECEIPT: ${{ steps.receipts.outputs.plain }}
          METHODS_RECEIPT: ${{ steps.receipts.outputs.methods }}
          ARTIFACT: ${{ inputs.mode == 'diagnostic' && 'diagnostic-' || (inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || 'official-run-') }}${{ matrix.population }}
        run: >
          node scripts/stage-timing-summary.mjs --timings "$STAGE_TIMINGS" --title "$MODE: $POPULATION"
          --note "Stage receipts (#762): each finished stage is uploaded as stage-<stage>-$POPULATION; a retry reuses it only on an identical identity (the driver's log names the source)."
          --note "Retry of run ${RETRY_RUN_ID:-none}: plain receipt ${PLAIN_RECEIPT:-n/a}, methods receipt ${METHODS_RECEIPT:-n/a} (reuse = offered to the driver; the stage timing shows whether the engine ran)."
          --note "Engine build cache: ${{ steps.engine-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}. Artifact: $ARTIFACT (this run's Artifacts section)."
          >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the byte copies the checks made
        run: rm -f "official-out/$POPULATION"/artifact-[0-9]*.json "official-out/$POPULATION"/methods/artifact-[0-9]*.json
        env:
          POPULATION: ${{ matrix.population }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }} # keep the plain artifact when the methods step fails, and the finished engine output (with its INCOMPLETE marker) when the checks after it fail or the job is cancelled (#762)
        with:
          name: ${{ inputs.mode == 'diagnostic' && 'diagnostic-' || (inputs.candidate != '' && 'candidate-run-' || (inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || 'official-run-')) }}${{ matrix.population }}
          path: official-out/${{ matrix.population }}
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 90

  qualification-view:
    name: Qualification view
    needs: [plan, official-run]
    # A skipped scanner job is the view-only retry (reuse_run_id); a failed one is not retried here. A diagnostic run builds no view (#705); a candidate replay builds none either (#698).
    if: ${{ !cancelled() && inputs.mode != 'diagnostic' && inputs.attribution == '' && inputs.candidate == '' && needs.plan.result == 'success' && needs.plan.outputs.rehearsal != 'true' && (needs.official-run.result == 'success' || needs.official-run.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the artifacts of the reused run
    env:
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The reused run is an official-runs run of this repository
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "reuse_run_id must be a run id"; exit 1; }
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq '.path')
          test "$path" = ".github/workflows/official-runs.yml" || { echo "run $REUSE_RUN_ID is $path, not official-runs.yml"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          pattern: official-run-*
          path: official-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          pattern: official-run-*
          path: official-in
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Lay the artifacts out one directory per population
        run: |
          for dir in official-in/official-run-*; do mv "$dir" "official-in/${dir#official-in/official-run-}"; done
      - name: Fetch the pinned public snapshot and verify it against the registry pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-pinned-public-snapshot.mjs --out snapshot-in
      - name: Derive the axis overlay, twin-scope map and review-ledger re-key from that snapshot and the methods artifact
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: >
          npm run qualification:derive-inputs --
          --snapshot snapshot-in/credential-eval-corpus-snapshot.json
          --plain-run official-in/public-evidence-snapshot/artifact.json
          --methods-run official-in/public-evidence-snapshot/methods/artifact.json
          --out derived-inputs
      - name: Build the qualification view from the artifacts and the derived inputs
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          npm run qualification:view -- --artifacts official-in --inputs derived-inputs --out qualification-out/qualification-v1.json
          cp derived-inputs/derived-inputs.json qualification-out/derived-inputs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-view
          path: qualification-out
          if-no-files-found: error
          retention-days: 90

  report:
    name: Effect report (candidate against the control)
    needs: official-run
    if: ${{ !cancelled() && inputs.candidate != '' && (needs.official-run.result == 'success' || (needs.official-run.result == 'skipped' && inputs.reuse_candidate_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CANDIDATE: ${{ inputs.candidate }}
      EVIDENCE_TAG: ${{ inputs.evidence_tag }}
      EVIDENCE_DIGEST: ${{ inputs.evidence_manifest_digest }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A reused run is a candidate run of this workflow, for this candidate, at a commit of this repository
        if: ${{ inputs.reuse_candidate_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ inputs.reuse_candidate_run_id }}
        run: |
          [[ "$REUSE" =~ ^[0-9]+$ ]] || { echo "::error::reuse_candidate_run_id must be a run id"; exit 1; }
          [ -z "${{ inputs.reuse_run_id }}" ] && [ -z "${{ inputs.attribution }}" ] || { echo "::error::reuse_candidate_run_id is exclusive with reuse_run_id and attribution"; exit 1; }
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE" --jq '.path')
          test "$path" = ".github/workflows/official-runs.yml" || { echo "::error::run $REUSE is $path, not official-runs.yml"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_candidate_run_id == '' }}
        with:
          pattern: candidate-run-*
          path: replay-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_candidate_run_id != '' }}
        with:
          pattern: candidate-run-*
          path: replay-in
          run-id: ${{ inputs.reuse_candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Lay the candidate artifacts out one directory per population
        run: for dir in replay-in/candidate-run-*; do mv "$dir" "replay-in/${dir#replay-in/candidate-run-}"; done
      - name: Fetch the control (the engine candidate's replay of the published product) and verify its digest against the adoption record
        run: |
          release="$(node scripts/candidate-control.mjs ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --manifest-digest "$EVIDENCE_DIGEST"} --field archive.release)"
          digest="$(node scripts/candidate-control.mjs ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --manifest-digest "$EVIDENCE_DIGEST"} --field archive.sha256)"
          node scripts/replay-archive.mjs fetch --release "$release" --sha256 "$digest" --out control-in
      - name: Fetch the pinned public snapshot (the case inputs of the sanitized view)
        run: node scripts/fetch-pinned-public-snapshot.mjs --out snapshot-in ${EVIDENCE_TAG:+--tag "$EVIDENCE_TAG" --manifest-digest "$EVIDENCE_DIGEST"}
      - name: The effect report (strict comparison keyed by semantic ids; findings, sanitized views and repeat-run agreement of both sides) and the triage rules with the candidate's verified fixes
        run: >
          node scripts/candidate-replay-pipeline.mjs --control control-in --candidate replay-in --candidate-id "$CANDIDATE"
          --snapshot snapshot-in/credential-eval-corpus-snapshot.json --out report-out ${EVIDENCE_TAG:+--evidence-tag "$EVIDENCE_TAG" --evidence-manifest-digest "$EVIDENCE_DIGEST"}
      - name: Summary
        run: |
          { echo "### Product candidate replay: ${CANDIDATE}"; cat report-out/candidate-effect.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-replay-report
          path: report-out
          if-no-files-found: error
          retention-days: 90
