name: Official credential-eval runs
# Runs credential-eval officially, once per qualification population (#604), and builds the qualification view from the
# artifacts (#605). The floors population is run twice: a plain measurement and a methods run (#636). Manual only: it
# builds a private engine and runs five scanners, so it is never part of push or pull request validation. The pins are
# benchmarks/official-runs.json; the steps are credential-eval docs/consumers/benchmarks-quickstart.md.
# Spec: docs/specs/official-runs.md.
#
# Two modes (#705). `full` (the default) is the official run described above. `diagnostic` is the fast product-candidate lane: it runs only the
# product scanner over the regression and policy populations (the public population too only with include_public), as an EXPLORATORY, internal
# run, one engine run per population, no methods, no peers; each population job uploads its findings and outcome receipt as soon as it ends, and
# the summary states which scanners and methods did not run. Diagnostic artifacts are named diagnostic-<population>, are never read by the
# qualification-view job, never recorded or archived, and cannot pass the official binding. Spec: docs/specs/official-runs.md, "The diagnostic lane".
#
# Safety: dispatch only (never pull_request_target); contents: read; the engine token is a GitHub App token scoped to
# redact-secret/credential-eval with contents: read, minted in the job that needs it and never echoed; no checkout keeps
# credentials; every action is pinned to a commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: full = the official run (all populations, all scanners, two engine runs, methods, the qualification view). diagnostic = the fast product-candidate lane (#705); exploratory and internal, never promotable.
        required: false
        default: full
        type: choice
        options: [full, diagnostic]
      include_public:
        description: Diagnostic mode only. Also run the public evidence population for the product (a separate job; it never delays the regression and policy receipts).
        required: false
        default: false
        type: boolean
      reuse_run_id:
        description: Retry the view stage only (#699). The id of an earlier official-runs run whose scanner artifacts are valid; the scanner jobs are skipped and the view is built from that run's artifacts and the pinned snapshot of this commit.
        required: false
        default: ''
        type: string
      attribution:
        description: Make an ATTRIBUTION run (#697) of the registry's attributionRuns entry (for example core-beta.12, the previous product release on the same engine and evidence). The scanner jobs upload artifacts named attribution-<id>-<population>; the view stage is skipped, because an attribution run is never the accepted one.
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: official-runs
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the populations (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      populations: ${{ steps.plan.outputs.populations }}
    env:
      MODE: ${{ inputs.mode }}
      INCLUDE_PUBLIC: ${{ inputs.include_public }}
      ATTRIBUTION: ${{ inputs.attribution }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - id: plan
        run: |
          if [ "$MODE" = "diagnostic" ]; then
            [ -z "$ATTRIBUTION" ] && [ -z "$REUSE_RUN_ID" ] || { echo "::error::a diagnostic run takes neither attribution nor reuse_run_id"; exit 1; }
            if [ "$INCLUDE_PUBLIC" = "true" ]; then echo 'populations=["regression-corpus","policy-corpus","public-evidence-snapshot"]' >> "$GITHUB_OUTPUT"; else echo 'populations=["regression-corpus","policy-corpus"]' >> "$GITHUB_OUTPUT"; fi
          else
            [ "$INCLUDE_PUBLIC" != "true" ] || { echo "::error::include_public is for diagnostic mode; a full run always runs every population"; exit 1; }
            echo 'populations=["public-evidence-snapshot","regression-corpus","policy-corpus"]' >> "$GITHUB_OUTPUT"
          fi

  official-run:
    name: ${{ inputs.mode == 'diagnostic' && 'Diagnostic run' || 'Official run' }} (${{ matrix.population }})
    needs: plan
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180 # two plain and two methods runs; OpenRedaction's methods scan alone takes ~29 min of its 30-min per-scan limit (credential-eval ADR 0004)
    strategy:
      fail-fast: false
      matrix:
        population: ${{ fromJSON(needs.plan.outputs.populations) }}
    env:
      PLATFORM: linux-x64
      MODE: ${{ inputs.mode }}
      ATTRIBUTION: ${{ inputs.attribution }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The registry is consistent and each product corpus still matches its pin
        run: npm run official-runs:check -- --bindings

      - name: Read the engine pin
        id: engine
        run: |
          echo "tag=$(node -p "require('./benchmarks/official-runs.json').engine.tag")" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for the engine repository
        id: engine-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CREDENTIAL_EVAL_APP_ID }}
          private-key: ${{ secrets.CREDENTIAL_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: credential-eval
          permission-contents: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: redact-secret/credential-eval
          ref: ${{ steps.engine.outputs.tag }}
          token: ${{ steps.engine-token.outputs.token }}
          path: credential-eval
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Build the engine at the pinned tag
        run: cargo build --release --locked -p credential-eval-cli --manifest-path credential-eval/Cargo.toml
      - name: Provision the peer scanners at their pinned digests
        if: ${{ inputs.mode != 'diagnostic' }} # the diagnostic lane runs the product only; no peer is needed or waited for
        run: |
          node scripts/provision-official-peers.mjs --platform "$PLATFORM" --out "$RUNNER_TEMP/peer-bin"
          echo "$RUNNER_TEMP/peer-bin" >> "$GITHUB_PATH"
      - name: Read the Node shim directory (the attribution run's own, when one is made)
        id: shim
        run: |
          [[ -z "$ATTRIBUTION" || "$ATTRIBUTION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "attribution must be an id such as core-beta.12"; exit 1; }
          echo "dir=$(if [ -n "$ATTRIBUTION" ]; then node -p "require('./benchmarks/official-runs.json').attributionRuns['$ATTRIBUTION'].nodeDir"; else echo adapters/node; fi)" >> "$GITHUB_OUTPUT"
      - name: Install the npm scanners from the engine lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: credential-eval/${{ steps.shim.outputs.dir }}
      - name: Diagnostic run (product only, exploratory and internal)
        if: ${{ inputs.mode == 'diagnostic' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
        run: >
          node --import tsx scripts/run-official-credential-eval.ts
          --mode diagnostic --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION"
      - name: Diagnostic scope and outcomes
        if: ${{ inputs.mode == 'diagnostic' && !cancelled() }}
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          if [ -f "official-out/$POPULATION/diagnostic-summary.md" ]; then cat "official-out/$POPULATION/diagnostic-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Official run, twice, with the determinism check
        if: ${{ inputs.mode != 'diagnostic' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
        run: >
          node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 ${ATTRIBUTION:+--attribution "$ATTRIBUTION"}
      - name: Methods run, twice, with the determinism check (floors population only)
        if: matrix.population == 'public-evidence-snapshot' && inputs.mode != 'diagnostic'
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
          NODE_OPTIONS: --max-old-space-size=5120
        run: >
          node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 --methods ${ATTRIBUTION:+--attribution "$ATTRIBUTION"}
      - name: Remove the byte copies the checks made
        run: rm -f "official-out/$POPULATION"/artifact-[0-9]*.json "official-out/$POPULATION"/methods/artifact-[0-9]*.json
        env:
          POPULATION: ${{ matrix.population }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }} # keep the plain artifact when the methods step fails
        with:
          name: ${{ inputs.mode == 'diagnostic' && 'diagnostic-' || (inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || 'official-run-') }}${{ matrix.population }}
          path: official-out/${{ matrix.population }}
          if-no-files-found: error
          retention-days: 90

  qualification-view:
    name: Qualification view
    needs: [plan, official-run]
    # A skipped scanner job is the view-only retry (reuse_run_id); a failed one is not retried here. A diagnostic run builds no view (#705).
    if: ${{ !cancelled() && inputs.mode != 'diagnostic' && inputs.attribution == '' && needs.plan.result == 'success' && (needs.official-run.result == 'success' || needs.official-run.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the artifacts of the reused run
    env:
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The reused run is an official-runs run of this repository
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "reuse_run_id must be a run id"; exit 1; }
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq '.path')
          test "$path" = ".github/workflows/official-runs.yml" || { echo "run $REUSE_RUN_ID is $path, not official-runs.yml"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          pattern: official-run-*
          path: official-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          pattern: official-run-*
          path: official-in
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Lay the artifacts out one directory per population
        run: |
          for dir in official-in/official-run-*; do mv "$dir" "official-in/${dir#official-in/official-run-}"; done
      - name: Fetch the pinned public snapshot and verify it against the registry pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-pinned-public-snapshot.mjs --out snapshot-in
      - name: Derive the axis overlay, twin-scope map and review-ledger re-key from that snapshot and the methods artifact
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: >
          npm run qualification:derive-inputs --
          --snapshot snapshot-in/credential-eval-corpus-snapshot.json
          --plain-run official-in/public-evidence-snapshot/artifact.json
          --methods-run official-in/public-evidence-snapshot/methods/artifact.json
          --out derived-inputs
      - name: Build the qualification view from the artifacts and the derived inputs
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          npm run qualification:view -- --artifacts official-in --inputs derived-inputs --out qualification-out/qualification-v1.json
          cp derived-inputs/derived-inputs.json qualification-out/derived-inputs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-view
          path: qualification-out
          if-no-files-found: error
          retention-days: 90
