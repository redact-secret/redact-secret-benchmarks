name: Official credential-eval runs
# Runs credential-eval officially, once per qualification population (#604), and builds the qualification view from the
# artifacts (#605). The floors population is run twice: a plain measurement and a methods run (#636). Manual only: it
# builds a private engine and runs five scanners, so it is never part of push or pull request validation. The pins are
# benchmarks/official-runs.json; the steps are credential-eval docs/consumers/benchmarks-quickstart.md.
# Spec: docs/specs/official-runs.md.
#
# Safety: dispatch only (never pull_request_target); contents: read; the engine token is a GitHub App token scoped to
# redact-secret/credential-eval with contents: read, minted in the job that needs it and never echoed; no checkout keeps
# credentials; every action is pinned to a commit.
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Retry the view stage only (#699). The id of an earlier official-runs run whose scanner artifacts are valid; the scanner jobs are skipped and the view is built from that run's artifacts and the pinned snapshot of this commit.
        required: false
        default: ''
        type: string
      attribution:
        description: Make an ATTRIBUTION run (#697) of the registry's attributionRuns entry (for example core-beta.12, the previous product release on the same engine and evidence). The scanner jobs upload artifacts named attribution-<id>-<population>; the view stage is skipped, because an attribution run is never the accepted one.
        required: false
        default: ''
        type: string
      candidate:
        description: Measure a registered UNPUBLISHED product build (an id in benchmarks/product-candidates.json, for example core-main-1e45cecf) on the adoption's engine candidate instead of an official run (#698). Exploratory and internal, never an accepted run; builds the effect report against the engine candidate's control and archives the artifacts (candidate-runs-<run id>). Spec docs/specs/product-candidate-replay.md.
        required: false
        default: ''
        type: string
      archive:
        description: With a candidate, keep the replay artifacts as a release of this repository after a passing report.
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: official-runs
  cancel-in-progress: false

jobs:
  official-run:
    name: Official run (${{ matrix.population }})
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180 # two plain and two methods runs; OpenRedaction's methods scan alone takes ~29 min of its 30-min per-scan limit (credential-eval ADR 0004)
    strategy:
      fail-fast: false
      matrix:
        population: [public-evidence-snapshot, regression-corpus, policy-corpus]
    env:
      PLATFORM: linux-x64
      ATTRIBUTION: ${{ inputs.attribution }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A candidate is registered and unpublished, its release holds the registered bytes, and it is not an attribution run
        if: ${{ inputs.candidate != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "::error::candidate must be a registered id"; exit 1; }
          [ -z "$ATTRIBUTION" ] || { echo "::error::attribution and candidate are exclusive"; exit 1; }
          node scripts/check-product-candidates.mjs --bindings
          node -e "const r=require('./benchmarks/product-candidates.json'); if(!r.candidates.some(c=>c.id===process.env.CANDIDATE)){console.error('no such candidate');process.exit(1)}"
      - name: The registry is consistent and each product corpus still matches its pin
        run: npm run official-runs:check -- --bindings

      - name: Read the engine pin
        id: engine
        run: |
          echo "tag=$(if [ -n "$CANDIDATE" ]; then node -p "require('./benchmarks/evidence-adoption.json').engineCandidate.engine.tag"; else node -p "require('./benchmarks/official-runs.json').engine.tag"; fi)" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for the engine repository
        id: engine-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CREDENTIAL_EVAL_APP_ID }}
          private-key: ${{ secrets.CREDENTIAL_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: credential-eval
          permission-contents: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: redact-secret/credential-eval
          ref: ${{ steps.engine.outputs.tag }}
          token: ${{ steps.engine-token.outputs.token }}
          path: credential-eval
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Build the engine at the pinned tag
        run: cargo build --release --locked -p credential-eval-cli --manifest-path credential-eval/Cargo.toml
      - name: Provision the peer scanners at their pinned digests
        run: |
          node scripts/provision-official-peers.mjs --platform "$PLATFORM" --out "$RUNNER_TEMP/peer-bin"
          echo "$RUNNER_TEMP/peer-bin" >> "$GITHUB_PATH"
      - name: Read the Node shim directory (the attribution run's own, when one is made)
        id: shim
        run: |
          [[ -z "$ATTRIBUTION" || "$ATTRIBUTION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "attribution must be an id such as core-beta.12"; exit 1; }
          echo "dir=$(if [ -n "$ATTRIBUTION" ]; then node -p "require('./benchmarks/official-runs.json').attributionRuns['$ATTRIBUTION'].nodeDir"; else echo adapters/node; fi)" >> "$GITHUB_OUTPUT"
      - name: Install the npm scanners from the engine lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: credential-eval/${{ steps.shim.outputs.dir }}
      - name: Official run, twice, with the determinism check
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
        run: >
          node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 ${ATTRIBUTION:+--attribution "$ATTRIBUTION"} ${CANDIDATE:+--candidate "$CANDIDATE"}
      - name: Methods run, twice, with the determinism check (floors population only)
        if: matrix.population == 'public-evidence-snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
          POPULATION: ${{ matrix.population }}
          NODE_OPTIONS: --max-old-space-size=5120
        run: >
          node --import tsx scripts/run-official-credential-eval.ts
          --population "$POPULATION" --engine-dir credential-eval --platform "$PLATFORM"
          --out "official-out/$POPULATION" --runs 2 --methods ${ATTRIBUTION:+--attribution "$ATTRIBUTION"} ${CANDIDATE:+--candidate "$CANDIDATE"}
      - name: Remove the byte copies the checks made
        run: rm -f "official-out/$POPULATION"/artifact-[0-9]*.json "official-out/$POPULATION"/methods/artifact-[0-9]*.json
        env:
          POPULATION: ${{ matrix.population }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }} # keep the plain artifact when the methods step fails
        with:
          name: ${{ inputs.candidate != '' && 'candidate-run-' || (inputs.attribution != '' && format('attribution-{0}-', inputs.attribution) || 'official-run-') }}${{ matrix.population }}
          path: official-out/${{ matrix.population }}
          if-no-files-found: error
          retention-days: 90

  qualification-view:
    name: Qualification view
    needs: official-run
    # A skipped scanner job is the view-only retry (reuse_run_id); a failed one is not retried here.
    if: ${{ !cancelled() && inputs.attribution == '' && inputs.candidate == '' && (needs.official-run.result == 'success' || needs.official-run.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the artifacts of the reused run
    env:
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The reused run is an official-runs run of this repository
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "reuse_run_id must be a run id"; exit 1; }
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq '.path')
          test "$path" = ".github/workflows/official-runs.yml" || { echo "run $REUSE_RUN_ID is $path, not official-runs.yml"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id == '' }}
        with:
          pattern: official-run-*
          path: official-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          pattern: official-run-*
          path: official-in
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Lay the artifacts out one directory per population
        run: |
          for dir in official-in/official-run-*; do mv "$dir" "official-in/${dir#official-in/official-run-}"; done
      - name: Fetch the pinned public snapshot and verify it against the registry pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-pinned-public-snapshot.mjs --out snapshot-in
      - name: Derive the axis overlay, twin-scope map and review-ledger re-key from that snapshot and the methods artifact
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: >
          npm run qualification:derive-inputs --
          --snapshot snapshot-in/credential-eval-corpus-snapshot.json
          --plain-run official-in/public-evidence-snapshot/artifact.json
          --methods-run official-in/public-evidence-snapshot/methods/artifact.json
          --out derived-inputs
      - name: Build the qualification view from the artifacts and the derived inputs
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          npm run qualification:view -- --artifacts official-in --inputs derived-inputs --out qualification-out/qualification-v1.json
          cp derived-inputs/derived-inputs.json qualification-out/derived-inputs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-view
          path: qualification-out
          if-no-files-found: error
          retention-days: 90

  report:
    name: Effect report (candidate against the control)
    needs: official-run
    if: ${{ !cancelled() && inputs.candidate != '' && needs.official-run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CANDIDATE: ${{ inputs.candidate }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-run-*
          path: replay-in
      - name: Lay the candidate artifacts out one directory per population
        run: for dir in replay-in/candidate-run-*; do mv "$dir" "replay-in/${dir#replay-in/candidate-run-}"; done
      - name: Fetch the control (the engine candidate's replay of the published product) and verify its digest against the adoption record
        run: |
          release="$(node -p "require('./benchmarks/evidence-adoption.json').engineCandidate.replay.archive.release")"
          digest="$(node -p "require('./benchmarks/evidence-adoption.json').engineCandidate.replay.archive.sha256")"
          node scripts/replay-archive.mjs fetch --release "$release" --sha256 "$digest" --out control-in
      - name: Fetch the pinned public snapshot (the case inputs of the sanitized view)
        run: node scripts/fetch-pinned-public-snapshot.mjs --out snapshot-in
      - name: Every difference is an identity field or a per-case outcome (strict), keyed by semantic ids
        run: >
          node --import tsx scripts/compare-replay-effects.ts --from control-in --to replay-in
          --label "product effect: published control to unpublished candidate $CANDIDATE" --out report-out/effect.json --strict
      - name: The effect report, with the findings, the sanitized view and the repeat-run agreement of both sides
        run: >
          node --import tsx scripts/candidate-replay-report.ts --control control-in --candidate replay-in --candidate-id "$CANDIDATE"
          --snapshot snapshot-in/credential-eval-corpus-snapshot.json --out report-out
      - name: Apply the triage rules with the candidate's verified fixes
        run: >
          node --import tsx scripts/apply-triage-decisions.ts
          --queue docs/generated/evidence-adoption/snapshot-2026.10.04.3.triage-queue.json
          --candidate report-out/candidate-effect.json --open-core-issue https://github.com/redact-secret/redact-secret/issues/1203
          --out-json report-out/triage.json --out-md report-out/triage.md
      - name: Summary
        run: |
          { echo "### Product candidate replay: ${CANDIDATE}"; cat report-out/candidate-effect.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-replay-report
          path: report-out
          if-no-files-found: error
          retention-days: 90

  archive:
    name: Keep the replay artifacts (a release of this repository, never an accepted run)
    needs: report
    if: ${{ inputs.candidate != '' && inputs.archive }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-run-*
          path: replay-in
      - run: for dir in replay-in/candidate-run-*; do mv "$dir" "replay-in/${dir#replay-in/candidate-run-}"; done
      - name: Pack and publish candidate-runs-<run id>
        id: pack
        run: |
          out="$(node scripts/replay-archive.mjs pack --in replay-in --out archive-out --tag "candidate-runs-${GITHUB_RUN_ID}" --notes "Candidate replay ${CANDIDATE}: exploratory, internal artifacts of an unpublished build. Never accepted runs and never public evidence.")"
          echo "$out"
          echo "digest=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s.slice(s.indexOf('{'))).digest))")" >> "$GITHUB_OUTPUT"
      - run: echo "candidate-runs-${GITHUB_RUN_ID} ${{ steps.pack.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
