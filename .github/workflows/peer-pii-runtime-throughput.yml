name: Peer PII runtime throughput

# #513: runs the pinned Docker image on a native amd64 runner and uploads the report.
# The report is the candidate for evidence/429/peer-pii-runtime-throughput.json; commit it by hand after review.
# #562/#563: the `runtime-comparison-v2` measurement runs the same image once per redact-secret setting and uploads
# the three reports, the candidates for evidence/562/. The default measurement is unchanged.
on:
  workflow_dispatch:
    inputs:
      measurement:
        description: Which measurement to run
        type: choice
        options:
          - peer-pii-runtime-throughput-v1
          - runtime-comparison-v2
        default: peer-pii-runtime-throughput-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 22 }
      - name: Build the pinned image and measure
        if: inputs.measurement != 'runtime-comparison-v2'
        run: scripts/run-peer-pii-runtime-throughput-docker.sh --out=evidence/429/peer-pii-runtime-throughput.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.measurement != 'runtime-comparison-v2'
        with:
          name: peer-pii-runtime-throughput
          path: evidence/429/peer-pii-runtime-throughput.json
          if-no-files-found: error
      - name: Build the pinned image and measure every setting
        if: inputs.measurement == 'runtime-comparison-v2'
        run: scripts/run-runtime-comparison-docker.sh --out-dir=evidence/562
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.measurement == 'runtime-comparison-v2'
        with:
          name: runtime-comparison
          path: evidence/562/runtime-comparison-*.json
          if-no-files-found: error
