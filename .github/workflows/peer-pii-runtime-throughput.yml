name: Peer PII runtime throughput

# #513: runs the pinned Docker image on a native amd64 runner and uploads the report.
# The report is the candidate for results-output/peer-pii-runtime-throughput/report.json; prepare a source-bound current receipt after review.
# #562/#563: the `runtime-comparison-v2` measurement runs the same image once per redact-secret setting and uploads
# the three reports, fresh ignored measurements, reviewed before a current receipt is promoted. The default measurement is unchanged.
on:
  workflow_dispatch:
    inputs:
      measurement:
        description: Which measurement to run
        type: choice
        options:
          - peer-pii-runtime-throughput-v1
          - runtime-comparison-v2
        default: peer-pii-runtime-throughput-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: Build the pinned image and measure
        if: inputs.measurement != 'runtime-comparison-v2'
        run: scripts/run-peer-pii-runtime-throughput-docker.sh --out=results-output/peer-pii-runtime-throughput/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.measurement != 'runtime-comparison-v2'
        with:
          name: peer-pii-runtime-throughput
          path: results-output/peer-pii-runtime-throughput/report.json
          if-no-files-found: error
      - name: Build the pinned image and measure every setting
        if: inputs.measurement == 'runtime-comparison-v2'
        run: scripts/run-runtime-comparison-docker.sh --out-dir=results-output/runtime-comparison
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.measurement == 'runtime-comparison-v2'
        with:
          name: runtime-comparison
          path: results-output/runtime-comparison/runtime-comparison-*.json
          if-no-files-found: error
