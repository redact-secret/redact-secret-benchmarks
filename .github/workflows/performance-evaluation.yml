name: Performance evaluation

# Builds redact-secret's real product artifacts at the exact commit
# benchmarks/pin-manifest.json pins, runs core's own bounded assessment
# (npm run assessment:all, release builds, five repetitions), and evaluates
# the result against this repository's own criteria
# (benchmarks/performance-criteria.json) -- the ownership this repository
# took over from core per redact-secret#603 (DS11) / #136. No cross-repo
# token or artifact handoff: this workflow only reads core's public source at
# a pinned commit and runs its own public npm scripts.
#
# Before building anything, it also checks core's live assessment/complete.ts
# and assessment/schema.ts (at the same pinned commit it already checked out)
# against this repository's pinned copy of that contract
# (benchmarks/lib/performance-schema.ts), and fails fast on drift -- #150.
#
# Timing budgets are judged on same-job paired ratios (#303): the job also
# builds the budgets' baseline revision next to the candidate and runs both
# through core's assessment interleaved (A B B A ...) on this one runner, so a
# change of runner machine class cancels out of the candidate/baseline ratio.
# Dispatching with candidate_revision equal to baseline_revision is an A/A run:
# the baseline built twice and measured against itself, which is what the
# ratio thresholds' noise term is derived from. The runner's CPU model is
# recorded in every run's evidence.
#
# This does not check out core's own acceptance-criteria*.json (core is
# retiring that ownership) and does not publish anything or gate a release.
on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Core commit to pair against (40 hex). Empty uses the regression budgets' current baseline commit.
        required: false
        default: ""
      candidate_revision:
        description: Core commit to evaluate (40 hex). Empty uses the pin manifest's revision. Equal to the baseline makes an A/A run.
        required: false
        default: ""
      rounds:
        description: Interleaved rounds per side (even), each one assessment invocation of two fresh-process samples.
        required: false
        default: "6"

permissions: {}

jobs:
  evaluate:
    name: Evaluate the pinned core commit against benchmarks-owned criteria
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      WASM_BINDGEN_VERSION: "0.2.128"

    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: benchmarks-repo

      - name: Resolve the candidate and baseline core commits
        id: pin
        env:
          BASELINE_INPUT: ${{ inputs.baseline_revision }}
          CANDIDATE_INPUT: ${{ inputs.candidate_revision }}
          ROUNDS_INPUT: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          candidate="${CANDIDATE_INPUT:-$(node -p "require('./benchmarks-repo/benchmarks/pin-manifest.json').pins.redactSecretRevision")}"
          baseline="${BASELINE_INPUT:-$(node -p "const b = require('./benchmarks-repo/benchmarks/regression-budgets.json'); b.baselines.find(r => r.id === b.baseline).sourceCommit")}"
          rounds="${ROUNDS_INPUT:-6}"
          for value in "$candidate" "$baseline"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::core revisions must be 40-hex commits"; exit 1; }
          done
          if ! [[ "$rounds" =~ ^[0-9]+$ ]] || (( rounds < 2 || rounds % 2 != 0 || rounds > 20 )); then
            echo "::error::rounds must be an even number from 2 through 20"
            exit 1
          fi
          {
            echo "revision=$candidate"
            echo "baseline=$baseline"
            echo "rounds=$rounds"
          } >> "$GITHUB_OUTPUT"

      - name: Check out core at the candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: redact-secret/redact-secret
          ref: ${{ steps.pin.outputs.revision }}
          persist-credentials: false
          path: core-repo

      - name: Check out core at the baseline commit, built separately even for an A/A run
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: redact-secret/redact-secret
          ref: ${{ steps.pin.outputs.baseline }}
          persist-credentials: false
          path: core-baseline

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust and the browser target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            core-repo
            core-baseline
          key: performance-evaluation-paired

      - name: Install this repository's dependencies (for evaluation, not building core)
        working-directory: benchmarks-repo
        run: npm ci

      - name: Check core's live schema for drift against the pinned contract before building anything
        working-directory: benchmarks-repo
        run: |
          node --import tsx scripts/check-performance-schema-drift.mjs --core-repo ../core-repo
          node --import tsx scripts/check-performance-schema-drift.mjs --core-repo ../core-baseline

      - name: Install core's repository and addon dependencies (candidate and baseline)
        run: |
          set -euo pipefail
          for dir in core-repo core-baseline; do
            npm --prefix "$dir" ci --ignore-scripts
            npm --prefix "$dir/bindings/node" ci --ignore-scripts
          done

      - name: Build core's native, browser, JavaScript, CLI, and Python artifacts (candidate and baseline)
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          python -m pip install 'maturin>=1.10,<2'
          for dir in core-repo core-baseline; do
            (
              cd "$dir"
              npm --prefix bindings/node run build
              npm run js:build
              npm run wasm:build
              cargo build --release --locked -p redact-secret-cli
              maturin build --release --locked -m bindings/python/Cargo.toml -o dist
            )
          done

      - name: Install each side's Python wheel without an index or source fallback
        run: |
          set -euo pipefail
          for dir in core-repo core-baseline; do
            python -m venv "$dir/.venv"
            "$dir/.venv/bin/python" -m pip install --no-index --no-deps --only-binary :all: \
              --disable-pip-version-check "$dir"/dist/redact_secret-*.whl
          done

      - name: Install Chromium
        run: |
          set -euo pipefail
          (cd core-repo && npx playwright install --with-deps chromium)
          (cd core-baseline && npx playwright install chromium)

      - name: Run core's bounded cross-language assessment
        working-directory: core-repo
        run: npm run assessment:all -- --python .venv/bin/python --runs 5 --output-dir ../performance-output

      - name: Record the runner's machine (after the assessment created performance-output/)
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          node benchmarks-repo/scripts/record-runner.mjs --cpu-model "$model" --out performance-output/runner.json

      - name: Measure baseline and candidate interleaved on this runner (paired timing, #303)
        working-directory: benchmarks-repo
        env:
          ROUNDS: ${{ steps.pin.outputs.rounds }}
          BASELINE: ${{ steps.pin.outputs.baseline }}
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set -euo pipefail
          node --import tsx scripts/paired-performance.mjs run \
            --baseline-dir ../core-baseline --candidate-dir ../core-repo \
            --rounds "$ROUNDS" --runs 2 --out-dir ../performance-output/paired-raw
          node --import tsx scripts/paired-performance.mjs reduce \
            --dir ../performance-output/paired-raw \
            --baseline-revision "$BASELINE" --candidate-revision "$REVISION" \
            --runner ../performance-output/runner.json \
            --out ../performance-output/paired.json

      - name: Check the assessment result for schema drift against the pinned contract
        working-directory: benchmarks-repo
        run: node scripts/check-performance-schema.mjs --summary ../performance-output/summary.json

      - name: Evaluate the fixed RC acceptance criteria this repository owns
        working-directory: benchmarks-repo
        run: |
          node --import tsx benchmarks/evaluate-performance.ts \
            --summary ../performance-output/summary.json \
            --criteria benchmarks/performance-criteria.json \
            --json-out ../performance-output/acceptance.json \
            --markdown-out ../performance-output/acceptance.md

      - name: Add acceptance results to the workflow summary
        if: always() && hashFiles('performance-output/acceptance.md') != ''
        run: sed -n '1,$p' performance-output/acceptance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Judge the run against the reviewed regression budgets (#143)
        # Exit 1 is a measured regression; exit 2 is a measurement that cannot
        # be judged (wrong profile, too few samples, a tail-only change) and
        # must be rerun. The two carry different annotations so a rerun is
        # never mistaken for a regression, or the reverse.
        if: always() && hashFiles('performance-output/summary.json') != ''
        working-directory: benchmarks-repo
        env:
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set +e
          paired=()
          if [ -f ../performance-output/paired.json ]; then paired=(--paired ../performance-output/paired.json); fi
          node --import tsx scripts/regression-budgets.mjs evaluate \
            --summary ../performance-output/summary.json "${paired[@]}" \
            --source-commit "$REVISION" \
            --json-out ../performance-output/regression-budgets.json \
            --markdown-out ../performance-output/regression-budgets.md
          code=$?
          case "$code" in
            0) ;;
            1) echo "::error title=Budget regression::a measured change breached a reviewed budget; fix it or record an accepted tradeoff" ;;
            2) echo "::error title=Measurement invalid, rerun::the run cannot be judged against the budgets; rerun before deciding" ;;
          esac
          exit "$code"

      - name: Add the budget verdict to the workflow summary
        if: always() && hashFiles('performance-output/regression-budgets.md') != ''
        run: sed -n '1,$p' performance-output/regression-budgets.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw samples, results, and the acceptance verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evaluation-${{ steps.pin.outputs.revision }}
          path: performance-output/
          if-no-files-found: error
