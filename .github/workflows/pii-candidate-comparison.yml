name: PII baseline and candidate comparison (public synthetic)

# One exact paired measurement. The committed plan and fresh owner cost decision
# must authorise this dispatch; historical PII dispatch allowances stay spent.
on:
  workflow_call:
    secrets:
      PII_EVAL_APP_PRIVATE_KEY:
        required: true
      BENCHMARKS_DISPATCH_APP_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: pii-candidate-comparison
  cancel-in-progress: false

jobs:
  comparison:
    if: github.repository == 'redact-secret/redact-secret-benchmarks'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate the exact plan and its fresh dispatch authority
        id: plan
        run: |
          set -euo pipefail
          node scripts/pii-candidate-comparison-plan.mjs --check
          node scripts/pii-candidate-comparison-plan.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Refuse a second dispatch or rerun on this approved commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pii-comparison-dispatch.mjs

      - name: Read-only access to the pinned pii-eval engine
        id: engine-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '5178533'
          private-key: ${{ secrets.PII_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: pii-eval
          permission-actions: read
          permission-contents: read
      - name: Verify the canonical engine archive and binary
        id: engine
        env:
          GH_TOKEN: ${{ steps.engine-token.outputs.token }}
        run: node scripts/fetch-pii-eval-public-synthetic.mjs fetch-engine --out="$RUNNER_TEMP/pii-engine"
      - name: Fetch the engine's digest-pinned scanner shim
        env:
          GH_TOKEN: ${{ steps.engine-token.outputs.token }}
          ENGINE_COMMIT: ${{ steps.plan.outputs.engine_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pii-shim"
          gh api -H 'Accept: application/vnd.github.raw' "repos/redact-secret/pii-eval/contents/crates/pii-eval-adapters/shims/node/redact-secret-core.mjs?ref=${ENGINE_COMMIT}" > "$RUNNER_TEMP/pii-shim/redact-secret-core.mjs"
          test -s "$RUNNER_TEMP/pii-shim/redact-secret-core.mjs"

      - name: Read-only access to qualified product artifacts
        id: product-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BENCHMARKS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.BENCHMARKS_DISPATCH_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: redact-secret
          permission-actions: read
          permission-contents: read
      - name: Resolve the successful qualification push for the exact candidate
        id: product
        env:
          GH_TOKEN: ${{ steps.product-token.outputs.token }}
          PRODUCT_SHA: ${{ steps.plan.outputs.product_sha }}
          QUALIFICATION_RUN_ID: ${{ steps.plan.outputs.qualification_run_id }}
          PRODUCT_REF: main
        run: node scripts/qualified-candidate.mjs resolve --repository redact-secret/redact-secret
      - name: Verify qualified artifact uploads and inventory-bound binaries
        env:
          GH_TOKEN: ${{ steps.product-token.outputs.token }}
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          QUALIFICATION_RUN: ${{ steps.product.outputs.run-id }}
        run: >-
          node scripts/qualified-candidate.mjs fetch --repository redact-secret/redact-secret
          --sha "$PRODUCT_COMMIT" --run-id "$QUALIFICATION_RUN" --product-ref main
          --dir "$RUNNER_TEMP/pii-qualified"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redact-secret/redact-secret
          ref: ${{ steps.product.outputs.sha }}
          token: ${{ steps.product-token.outputs.token }}
          path: .redact-secret-product
          persist-credentials: false

      # Product code and scanners run without App tokens or secrets in their
      # environment. No protected input, ledger, EC2, or publishing credentials.
      - name: Pack the qualified candidate, including its PII WASM payload
        working-directory: .redact-secret-product
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run js:build
          node scripts/pack-npm-candidate.mjs \
            --addon-dir "$RUNNER_TEMP/pii-qualified/node-addon-x86_64-unknown-linux-gnu" \
            --wasm-dir "$RUNNER_TEMP/pii-qualified/wasm-web" \
            --wasm-common-dir "$RUNNER_TEMP/pii-qualified/wasm-web-common" \
            --out-dir "$RUNNER_TEMP/pii-candidate"
          test -z "$(git status --porcelain)"
      - name: Fetch the published baseline tarballs without lifecycle scripts
        env:
          BASELINE_VERSION: ${{ steps.plan.outputs.baseline_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pii-baseline"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pii-baseline" \
            "@redact-secret/core@$BASELINE_VERSION" \
            "@redact-secret/node-linux-x64-gnu@$BASELINE_VERSION" \
            "@redact-secret/wasm@$BASELINE_VERSION"
      - name: Verify packages, measure both sides, validate and compare
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
          BASELINE_VERSION: ${{ steps.plan.outputs.baseline_version }}
          CANDIDATE_VERSION: ${{ steps.plan.outputs.candidate_version }}
        run: |
          set -euo pipefail
          node --import tsx scripts/run-pii-candidate-comparison.mjs --require-canonical \
            --engine="$ENGINE" --shim="$RUNNER_TEMP/pii-shim/redact-secret-core.mjs" \
            --baseline-core="$RUNNER_TEMP/pii-baseline/redact-secret-core-$BASELINE_VERSION.tgz" \
            --baseline-node="$RUNNER_TEMP/pii-baseline/redact-secret-node-linux-x64-gnu-$BASELINE_VERSION.tgz" \
            --baseline-wasm="$RUNNER_TEMP/pii-baseline/redact-secret-wasm-$BASELINE_VERSION.tgz" \
            --candidate-core="$RUNNER_TEMP/pii-candidate/redact-secret-core-$CANDIDATE_VERSION.tgz" \
            --candidate-node="$RUNNER_TEMP/pii-candidate/redact-secret-node-linux-x64-gnu-$CANDIDATE_VERSION.tgz" \
            --candidate-wasm="$RUNNER_TEMP/pii-candidate/redact-secret-wasm-$CANDIDATE_VERSION.tgz" \
            --candidate-inventory="$RUNNER_TEMP/pii-qualified/artifact-inventory/artifact-inventory.json" \
            --node="$(command -v node)" --out="$RUNNER_TEMP/pii-comparison"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pii-candidate-comparison
          path: |
            ${{ runner.temp }}/pii-comparison/receipt.json
            ${{ runner.temp }}/pii-comparison/plan.json
            ${{ runner.temp }}/pii-comparison/summary.json
            ${{ runner.temp }}/pii-comparison/*.public-synthetic-artifact.json
          if-no-files-found: warn
          retention-days: 90
