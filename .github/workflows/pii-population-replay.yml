name: Replay the four PII populations with the canonical linux engine

# #665. Dispatch only. The four benchmark populations (#664) were built by a local darwin verification engine; this workflow replays the same
# frozen observations with the pinned linux engine artifact of the same pii-eval commit and compares each semantic digest (and the bytes) with
# the committed artifacts. Exploratory and internal: it launches no scanner, records nothing, promotes nothing and never changes a status, a
# threshold or an authority. A difference fails the job and is never normalised.
on:
  workflow_dispatch:

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PII_EVAL_APP_ID: '5178533'
      PII_EVAL_OWNER: redact-secret
      PII_EVAL_REPO: pii-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Mint read-only pii-eval installation token
        id: token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '5178533'
          private-key: ${{ secrets.PII_EVAL_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: pii-eval
          permission-actions: read
          permission-contents: read
      - name: Report missing App installation access (distinct from artifact and pin validation)
        if: steps.token.outcome != 'success'
        run: |
          echo "::error title=pii-eval App installation access missing::the installation token could not be minted, so no engine artifact was read (see #689)."
          exit 1
      - name: Download and verify the pinned linux engine artifact (the token is not passed on)
        id: engine
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/fetch-pii-eval-public-synthetic.mjs fetch-engine --out="$RUNNER_TEMP/pii-eval-engine"
      - name: Replay the frozen observations with that engine and compare with the committed artifacts
        # No token and no secret in this step: the engine only reads the committed, public synthetic conversion and writes under RUNNER_TEMP.
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: node --import tsx scripts/replay-pii-populations.mjs --engine="$ENGINE" --out="$RUNNER_TEMP/pii-replay" --receipt="$RUNNER_TEMP/pii-population-replay-receipt.json" | tee "$RUNNER_TEMP/receipt.txt" > /dev/null
      - name: Summary
        if: always()
        run: |
          test -f "$RUNNER_TEMP/pii-population-replay-receipt.json" || exit 0
          {
            echo "### PII population linux replay (exploratory, internal)"
            jq -r '"engine \(.engine.binarySha256) matches pin: \(.engine.matchesPin); platform \(.engine.platform); canonical: \(.canonical)", (.populations[] | "- \(.view): committed \(.semanticDigestCommitted[0:12]) replayed \(.semanticDigestReplayed[0:12]) equal=\(.equalSemanticDigest) bytesEqual=\(.bytesEqualCommitted) replaysIdentical=\(.replaysByteIdentical)")' "$RUNNER_TEMP/pii-population-replay-receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pii-population-replay-receipt
          path: ${{ runner.temp }}/pii-population-replay-receipt.json
          if-no-files-found: ignore
          retention-days: 30
