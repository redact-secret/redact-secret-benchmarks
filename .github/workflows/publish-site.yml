# Publishes the benchmarks site. This file is the upstream copy and is
# authoritative; `redact-secret/redact-secret-sites` holds a mirror at
# `docs/upstream/redact-secret-benchmarks--publish-site.yml` so the deployment
# design stays reviewable in one place. Keep the two in sync when either
# changes (#151).
#
# It builds the site (which means running the scanners, so it must happen in
# this repository) and publishes it straight to the matching S3 bucket in the
# redact-secret account, using the OIDC role that `infra/bootstrap` creates and
# that each site stack grants bucket access to.
#
# Branches map to environments:
#
#   develop -> staging.benchmarks.redactsecret.dev
#   main    -> benchmarks.redactsecret.dev
#
# Both measure the corpus against the released `@redact-secret/core` in the
# lockfile. Staging also measures a qualified `redact-secret` `main` commit with
# `eval:candidate`, from the artifacts that commit's own `artifact-qualification`
# run qualified, and ships it as candidate evidence (#152); production does not,
# and its Workbench Changes page says it reads the release instead (#213).
# Both publish a qualification run and a support matrix: staging's matrix
# classifies the candidate, production's the released package.
#
# The site is the Next.js app (`web/`, a static export) at the ROOT of the host,
# built from the same run and the same measured files, with the measured JSON
# beside it under /results/ (#602; docs/decisions/2026-10-02-serve-the-next-
# export-at-the-site-root.md, which supersedes the /next/ preview prefix). The
# legacy Vite UI is no longer built or published; its source and data code stay
# as the oracle. The first publish of an environment clears the legacy assets and
# index.html through the final `--delete` sync. Rollback is redeploying the previous
# workflow commit. The Next qualification pages read a view built here from the
# canonical official RunArtifacts, fetched from their durable archive and checked
# byte for byte against benchmarks/official-runs.json; a publish without that view
# fails. The credential evaluation is a sharded bundle, not one file (#791; docs/specs/evaluation-bundle-deployment.md):
# immutable parts under /results/evaluation-bundles/<bundleId>/ are uploaded and read back before the
# mutable pointer (/results/evaluation-bundle-v1.json) and the domain index (evaluation-domains-v2.json) move,
# in that order, last. S3 sync is not a multi-file transaction, so the ordering, not the sync, is what keeps
# every reader on one coherent run. Staging is kept out of search indexes by CloudFront's X-Robots-Tag, not by
# the build, so the same export is indexable on production.
#
# Per-environment configuration lives in the repository's GitHub environments,
# so this file carries no account ID and no bucket name:
#
#   staging      PUBLISHER_ROLE_ARN, SITE_STACK=redactsecret-site-benchmarks-staging
#   production   PUBLISHER_ROLE_ARN, SITE_STACK=redactsecret-site-benchmarks-prod
name: Publish benchmarks site

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Republish a site without pushing.
        type: environment
        required: true
        default: staging
      # redact-secret dispatches staging with this provenance group after its
      # main push passes artifact qualification (#153; the sending side is
      # docs/upstream/redact-secret--notify-benchmarks.yml). Untrusted: the
      # staging steps only use it to select artifacts.
      product_sha:
        description: redact-secret commit to measure on staging; ignored for production.
        type: string
        required: false
      qualification_run_id:
        description: Exact successful artifact-qualification run for product_sha; staging only.
        type: string
        required: false
      product_ref:
        description: Exact source ref for product_sha (main); staging only.
        type: string
        required: false

permissions: {}

env:
  TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

# One group per environment, never cancelling a run mid-sync. GitHub keeps at
# most one pending run per group and replaces it with the newest, so a burst of
# redact-secret pushes already collapses to the running publish plus the latest
# queued one (#153).
concurrency:
  group: publish-site-${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  pii-public-synthetic:
    if: ${{ (inputs.environment || (github.ref_name == 'main' && 'production' || 'staging')) == 'staging' }}
    uses: ./.github/workflows/pii-public-synthetic.yml
    permissions:
      contents: read
    secrets:
      PII_EVAL_APP_PRIVATE_KEY: ${{ secrets.PII_EVAL_APP_PRIVATE_KEY }}

  publish:
    needs: pii-public-synthetic
    if: ${{ !cancelled() && (needs.pii-public-synthetic.result == 'success' || needs.pii-public-synthetic.result == 'skipped') }}
    name: Publish to ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      # Production measures the released package only; a product commit sent
      # to it is a mistake, so fail rather than silently drop it.
      - name: Refuse a product commit for production
        if: env.TARGET == 'production' && (inputs.product_sha != '' || inputs.qualification_run_id != '' || inputs.product_ref != '')
        run: |
          echo "::error::candidate provenance inputs apply to staging only; production measures the released package."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      - name: Receive verified public-synthetic measurement from isolated job
        if: env.TARGET == 'staging'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-pii-public-synthetic
          path: ${{ runner.temp }}/pii-eval-public

      # The Next qualification pages need the canonical official RunArtifacts (#602).
      # Fetched first so a missing or altered artifact fails before anything slow runs.
      # contents: read is enough for the release asset; nothing is written back.
      - name: Fetch the canonical official RunArtifacts and check them against the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run official-runs:check -- --bindings
          node scripts/official-run-archive.mjs fetch --out "$RUNNER_TEMP/official-in"

      # Staging only (#152): stage an allowed redact-secret commit for eval:candidate
      # before anything slow runs, so a commit with no qualified artifacts fails
      # here. Production skips all of it and measures the released lockfile package.
      #
      # The token is scoped to redact-secret and to reading its Actions runs and
      # artifacts and its contents (to pack at the measured commit).
      - name: Mint a read-only token for redact-secret
        id: product-token
        if: env.TARGET == 'staging'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BENCHMARKS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.BENCHMARKS_DISPATCH_APP_PRIVATE_KEY }}
          owner: redact-secret
          repositories: redact-secret
          permission-actions: read
          permission-contents: read

      # PRODUCT_SHA (a dispatch input, #153) is untrusted: it must be 40 hex or the
      # run fails. A dispatched commit must name its exact successful push run and
      # source ref, which is restricted to `main`. Empty
      # (a push here) means the newest `main` commit that passed
      # qualification, so a push does not fail while the product's HEAD is still
      # qualifying. With no qualified candidate, staging is not published (the step
      # summary says why).
      - name: Resolve the redact-secret commit and its qualification run
        id: product
        if: env.TARGET == 'staging'
        env:
          GH_TOKEN: ${{ steps.product-token.outputs.token }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          PRODUCT_REF: ${{ inputs.product_ref }}
        run: node scripts/qualified-candidate.mjs resolve --repository redact-secret/redact-secret

      # Downloads the run's artifact-inventory and the linux-x64 addon and both wasm
      # builds, checking each zip against its upload digest, the inventory against
      # this commit and run, and each binary against the inventory.
      - name: Download and verify the qualified runtime artifacts
        if: env.TARGET == 'staging'
        env:
          GH_TOKEN: ${{ steps.product-token.outputs.token }}
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          QUALIFICATION_RUN: ${{ steps.product.outputs.run-id }}
          PRODUCT_REF: ${{ steps.product.outputs.product-ref }}
        run: >-
          node scripts/qualified-candidate.mjs fetch --repository redact-secret/redact-secret
          --sha "$PRODUCT_COMMIT" --run-id "$QUALIFICATION_RUN" --product-ref "$PRODUCT_REF"
          --dir "$RUNNER_TEMP/qualified"

      - name: Check out redact-secret at the measured commit
        if: env.TARGET == 'staging'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redact-secret/redact-secret
          ref: ${{ steps.product.outputs.sha }}
          token: ${{ steps.product-token.outputs.token }}
          path: .redact-secret-product
          persist-credentials: false

      # The qualification run uploads binaries, not tarballs, so they are packed the
      # way its clean-install lane packs them (nothing is compiled but the JS
      # wrapper), then required to be byte-identical to the tarballs it qualified.
      - name: Pack the qualified artifacts with the product's own pack script
        if: env.TARGET == 'staging'
        working-directory: .redact-secret-product
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run js:build
          node scripts/pack-npm-candidate.mjs \
            --addon-dir "$RUNNER_TEMP/qualified/node-addon-x86_64-unknown-linux-gnu" \
            --wasm-dir "$RUNNER_TEMP/qualified/wasm-web" \
            --wasm-common-dir "$RUNNER_TEMP/qualified/wasm-web-common" \
            --out-dir "$RUNNER_TEMP/candidate"
          # --product-state clean below asserts the tree is the commit, unmodified.
          test -z "$(git status --porcelain)"

      - name: Verify the packed tarballs are the qualified bytes
        id: candidate
        if: env.TARGET == 'staging'
        run: node scripts/qualified-candidate.mjs verify --dir "$RUNNER_TEMP/qualified" --packed "$RUNNER_TEMP/candidate"

      # --strict: a scanner that is unavailable fails the run instead of being
      # published as an "unavailable" row. Staging (#201) measures redact-secret
      # from the qualified main candidate, so its Report shows how that
      # exact source behaves; every report and run.json names it as unreleased.
      # Production measures the released lockfile package.
      - name: Measure the corpus
        env:
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          CORE_PACKAGE: ${{ steps.candidate.outputs.core }}
          NODE_PACKAGE: ${{ steps.candidate.outputs.node }}
          WASM_PACKAGE: ${{ steps.candidate.outputs.wasm }}
        run: |
          set -euo pipefail
          # Only a bundle produced during this run may affect publication.
          rm -f results-output/pii/population-release-v1.json
          if [ "$TARGET" = staging ]; then
            npm run bench -- --strict \
              --candidate-package="$CORE_PACKAGE" \
              --candidate-node-package="$NODE_PACKAGE" \
              --candidate-wasm-package="$WASM_PACKAGE" \
              --candidate-source-commit="$PRODUCT_COMMIT"
            # PII populations: the released lockfile package is the baseline,
            # this qualified candidate the candidate. The bundle binds only here.
            npm run pii:observe:populations -- \
              --candidate-core="$CORE_PACKAGE" \
              --candidate-node="$NODE_PACKAGE" \
              --candidate-wasm="$WASM_PACKAGE" \
              --candidate-source-commit="$PRODUCT_COMMIT" \
              --output=results-output/pii/population-release-v1.json
          else
            npm run bench -- --strict
          fi

      # Qualification still executes its distinct holdout lifecycle live. The
      # four-scanner comparison above has already consumed snapshots and cannot
      # accidentally fall back to these binaries.
      - name: Provision checksum-pinned peers for qualification only
        run: npm run peers:provision -- --dir "$RUNNER_TEMP/scanner-bin"

      - name: Verify the qualification peers, including TruffleHog 3.97.4
        run: |
          set -euo pipefail
          [ "$(command -v gitleaks)" = "$RUNNER_TEMP/scanner-bin/gitleaks" ]
          [ "$(command -v trufflehog)" = "$RUNNER_TEMP/scanner-bin/trufflehog" ]
          [ "$(trufflehog --version | awk '{print $2}')" = "3.97.4" ]

      # Both environments (#213): the Workbench Qualification checklist reads its
      # three engine floors (scanners complete, resolved rate, ledger rows for every
      # entry) from a qualification run published inside the evaluation bundle's summary part.
      # eval:qualify loads the lockfile package the suite pins
      # (qualification/suite-v1.json) with the pinned peers provisioned above, on
      # staging too, and the page names that version. Its public-control holdout is
      # generated fresh in this checkout, so its one-run budget is this run's.
      # An incomplete qualification is still evidence and is published with its
      # reasons; a run that wrote no report (tool drift, a crash) fails the publish.
      - name: Produce the evaluation and qualification reports the site reads
        run: |
          set -euo pipefail
          # The REQUIRED scanners of the official run class (benchmarks/support/scanner-roster.json), not the optional ones: OpenRedaction's default profile is an optional,
          # manual measurement (#763; it takes about five minutes here and its findings alone push the report past V8's string limit, which failed the publish of c336c331).
          scanners="$(jq -r '.runClasses.official.required | join(",")' benchmarks/support/scanner-roster.json)"
          # Only the store written by this run may be published: drop any earlier discovery store or single-file report and bundle pointer.
          rm -rf results-output/evaluation results-output/evaluation.json public/results/evaluation-bundle-v1.json
          npm run eval -- --scanner="$scanners"
          test -s results-output/evaluation/manifest.json || { echo "::error::npm run eval wrote no discovery store (results-output/evaluation/manifest.json)"; exit 1; }
          qualification=results-output/qualification/engine-v1.json
          rm -f "$qualification"
          if ! npm run eval:qualify; then
            test -s "$qualification" || { echo "::error::eval:qualify wrote no qualification report"; exit 1; }
            echo "::warning::qualification is $(jq -r .status "$qualification"): $(jq -r '.accounting.reasons | join(", ")' "$qualification")"
          fi
          # Carry only validated last-observation fields from the currently published
          # environment. Decisions and notes always come from this checkout's ledger.
          history=results-output/review-ledger-history.json
          origin="https://$([ "$TARGET" = production ] && echo benchmarks.redactsecret.dev || echo staging.benchmarks.redactsecret.dev)"
          if curl --fail --silent --show-error "$origin/results/review-ledger-v2.json" --output "$history"; then
            npm run eval:publish -- --qualification="$qualification" --ledger-history="$history"
          else
            echo "::notice::No prior review observation artifact; legacy entries remain cannot-verify until observed."
            npm run eval:publish -- --qualification="$qualification"
          fi
          # The immutable bundle and its pointer, validated by eval:publish itself; nothing public/ names a staging directory after a success.
          test -s public/results/evaluation-bundle-v1.json
          if find public/results -maxdepth 1 -name '.evaluation-bundle-*' | grep -q .; then echo "::error::a bundle staging directory was left in public/results"; exit 1; fi

      # Writes public/results/candidate-evidence-v1.json (reportType "candidate",
      # supportClaims false) beside, never into, the evaluation bundle; the page shows
      # it only as candidate evidence for the named commit. --expected-artifact-sha256
      # is the core tarball digest the product's qualification recorded, so
      # eval:candidate itself refuses any other core package. An incomplete
      # measurement exits non-zero and staging is not published.
      - name: Measure the qualified redact-secret commit as candidate evidence
        if: env.TARGET == 'staging'
        env:
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          CORE_PACKAGE: ${{ steps.candidate.outputs.core }}
          NODE_PACKAGE: ${{ steps.candidate.outputs.node }}
          WASM_PACKAGE: ${{ steps.candidate.outputs.wasm }}
          CORE_SHA256: ${{ steps.candidate.outputs.core-sha256 }}
        run: >-
          npm run eval:candidate --
          --candidate-package "$CORE_PACKAGE"
          --candidate-node-package "$NODE_PACKAGE"
          --candidate-wasm-package "$WASM_PACKAGE"
          --candidate-source-commit "$PRODUCT_COMMIT"
          --product-state clean
          --expected-artifact-sha256 "$CORE_SHA256"
          --output-dir "$GITHUB_WORKSPACE/public/results"

      # Classify every family's support and publish the matrix the Support page
      # reads. Staging classifies the same candidate build and the matrix records
      # that candidate; production classifies the released lockfile package
      # (published mode, #213) and the matrix records that release. The page
      # labels each by what it recorded.
      - name: Classify support
        env:
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          CORE_PACKAGE: ${{ steps.candidate.outputs.core }}
          NODE_PACKAGE: ${{ steps.candidate.outputs.node }}
          WASM_PACKAGE: ${{ steps.candidate.outputs.wasm }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = staging ]; then
            npm run eval:classify -- \
              --candidate-package="$CORE_PACKAGE" \
              --candidate-node-package="$NODE_PACKAGE" \
              --candidate-wasm-package="$WASM_PACKAGE" \
              --candidate-source-commit="$PRODUCT_COMMIT"
          else
            npm run eval:classify
          fi
          npm run eval:matrix
          npm run eval:publish:matrix
          # The Providers roadmap (#478): each family's stage, blocker and
          # research date, joining the provider dossiers with this matrix. Every
          # stage is derived, so no status is hand-written on the site.
          npm run dossiers:publish -- --require-matrix
          # Gate: the credential evaluation bundle and the support matrix pass
          # their validators before the v2 domain index is written below. The
          # v1 index and evaluation-v1.json are the opt-in --legacy-v1 contract
          # and are not part of normal publication (#790).
          npm run eval:publish:domains
          # PII support is a separate v2 artifact. The publisher validates the
          # complete credential bundle + PII set and renames the v2 index last.
          # Staging names the product it measured, so committed activation
          # evidence recorded for exactly that product (evidence/<n>/) binds;
          # production measures the release and binds none.
          product_args=()
          pii_eval_args=()
          if [ "$TARGET" = staging ]; then
            product_args=(--product-commit="$PRODUCT_COMMIT" --product-core="$CORE_PACKAGE")
            # The transport-verified CI measurement and the four committed benchmark populations (#664; the artifacts of the recorded
            # official run, #796) are separate pin sets: each artifact is judged by the set that names its population, and a candidate is bound to this
            # publication's product only when its pin names exactly this commit.
            pii_eval_args=(
              --pii-eval-pins=benchmarks/pii-eval-public-synthetic-pins.json
              --pii-eval-pins=benchmarks/pii-eval-population-pins.json
              --pii-eval-artifact="$RUNNER_TEMP/pii-eval-public/public-synthetic-artifact.json"
              --pii-eval-artifact=benchmarks/pii-eval-official-run/oracle-plan.public-synthetic-artifact.json
              --pii-eval-artifact=benchmarks/pii-eval-official-run/qualification-plan.public-synthetic-artifact.json
              --pii-eval-artifact=benchmarks/pii-eval-official-run/diagnostic-balanced.public-synthetic-artifact.json
              --pii-eval-artifact=benchmarks/pii-eval-official-run/benign-heavy-stress.public-synthetic-artifact.json
            )
          fi
          population_bundle=results-output/pii/population-release-v1.json
          if [ -s "$population_bundle" ]; then
            npm run eval:publish:pii-support -- "${product_args[@]}" "${pii_eval_args[@]}" --population-bundle="$population_bundle"
          else
            # No bundle: measured PII populations were skipped (for example, #515: core main equals the published release).
            echo "::notice::PII populations not measured for this publish: no comparison bundle was written (candidate equals the published release; no comparison)."
            npm run eval:publish:pii-support -- "${product_args[@]}" "${pii_eval_args[@]}" --population-mode=not-measured
          fi

      # The qualification view the Next pages read (public/results/qualification-v1.json, never committed). Same
      # artifacts and same product inputs write the same bytes. The product populations' case metadata is exported
      # from this checkout, whose corpus official-runs:check --bindings pinned above.
      - name: Build the qualification view from the official RunArtifacts
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          for population in regression-corpus policy-corpus; do
            npm run qualification:export -- --population "$population" --out "$RUNNER_TEMP/official-export/$population"
            mkdir -p "$RUNNER_TEMP/official-in/$population/inputs"
            cp "$RUNNER_TEMP/official-export/$population/case-metadata.json" "$RUNNER_TEMP/official-in/$population/inputs/"
          done
          rm -f public/results/qualification-v1.json
          npm run qualification:view -- --artifacts "$RUNNER_TEMP/official-in" --out public/results/qualification-v1.json

      # The site, exported statically for the root of the host (empty BASE_PATH). check:routes recounts the pages
      # from the files this run measured; WEB_REQUIRE_QUALIFICATION makes the "view not built" state (the normal
      # state of CI without a view) a failure, so a not-ready qualification page is never published.
      - name: Build the Next export and check its routes
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BASE_PATH: ''
          WEB_REQUIRE_RUN: '1'
          WEB_REQUIRE_QUALIFICATION: '1'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          npm run check:routes

      # The site root: the export at /, the measured files at /results/, robots.txt and favicon.svg from the export.
      # The guards scan what is about to ship (dist/ and public/); a refusal here is before anything is signed in.
      - name: Assemble the site root and run the publication guards on it
        run: |
          set -euo pipefail
          # Under tsx: assembling validates the whole evaluation bundle (every part, one at a time) and copies only the bundle the pointer names.
          node --import tsx scripts/assemble-site.mjs
          npm run features:check-public
          npm run blind:check-public
          # One coherent run: the pointer, its manifest, every referenced part and the domain index commitment agree; no staging or raw discovery file is in dist.
          npm run evaluation-bundle:check-publication
          test -s dist/robots.txt -a -s dist/favicon.svg -a -s dist/results/run.json -a -s dist/results/evaluation-bundle-v1.json
          echo "site root: $(find dist -type f | wc -l) files, $(du -sm dist | cut -f1) MB"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: publish-benchmarks-${{ github.run_id }}

      # Same three passes as scripts/publish-site.sh in redact-secret-sites:
      # fingerprinted assets first and kept forever, then everything else with
      # revalidation and stale files removed (on the first root publish this removes the
      # legacy index.html and the old next/ preview: neither is in dist; the legacy assets/ are removed after the swap), then
      # the fingerprinted chunks pruned once the new HTML is live.
      - name: Publish
        id: publish
        env:
          SITE_STACK: ${{ vars.SITE_STACK }}
        run: |
          set -euo pipefail
          outputs=$(aws cloudformation describe-stacks --stack-name "$SITE_STACK" \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`||OutputKey==`DistributionId`].[OutputKey,OutputValue]' \
            --output text)
          bucket=$(awk '$1=="BucketName"{print $2}' <<<"$outputs")
          distribution=$(awk '$1=="DistributionId"{print $2}' <<<"$outputs")
          test -n "$bucket" -a -n "$distribution"

          # Next's fingerprinted chunks (immutable, kept until the new HTML is live).
          aws s3 sync dist/_next/static "s3://$bucket/_next/static" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          pii_artifact=$(jq -r '.domains[] | select(.domain=="pii") | .support.href | ltrimstr("/")' dist/results/evaluation-domains-v2.json)
          test -f "dist/$pii_artifact"
          # Upload the immutable artifact before anything can point at it.
          aws s3 cp "dist/$pii_artifact" "s3://$bucket/$pii_artifact" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'

          # The evaluation bundle (#791). Its parts are immutable and content-addressed (the directory name is derived from their digests), so they
          # are uploaded first, without --delete, and kept long-lived. The live pointer is read before anything changes: it names the bundle that
          # stays reachable for readers mid-deployment and for rollback.
          bundle_id=$(jq -r .bundleId dist/results/evaluation-bundle-v1.json)
          [[ "$bundle_id" =~ ^[a-f0-9]{32}$ ]]
          # The publisher role may list and write the bucket but not read objects, so what is live is read over HTTPS from the site itself (public files).
          origin="https://$([ "$TARGET" = production ] && echo benchmarks.redactsecret.dev || echo staging.benchmarks.redactsecret.dev)"
          previous_id=
          if curl --fail --silent --show-error "$origin/results/evaluation-bundle-v1.json" --output "$RUNNER_TEMP/previous-pointer.json" 2>/dev/null \
            && curl --fail --silent --show-error "$origin/results/evaluation-domains-v2.json" --output "$RUNNER_TEMP/previous-index.json" 2>/dev/null \
            && jq -e '.bundleId | test("^[a-f0-9]{32}$")' "$RUNNER_TEMP/previous-pointer.json" >/dev/null; then
            previous_id=$(jq -r .bundleId "$RUNNER_TEMP/previous-pointer.json")
          fi
          aws s3 sync "dist/results/evaluation-bundles/$bundle_id" "s3://$bucket/results/evaluation-bundles/$bundle_id" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          # Availability before publication: the bucket must list every file of the validated bundle with its size and MD5 (the role cannot read objects back; the bytes were validated in dist).
          aws s3api list-objects-v2 --bucket "$bucket" --prefix "results/evaluation-bundles/$bundle_id/" --query 'Contents[].{Key:Key,Size:Size,ETag:ETag}' --output json > "$RUNNER_TEMP/bundle-listing.json"
          node --import tsx scripts/check-evaluation-bundle-publication.mjs --listing="$RUNNER_TEMP/bundle-listing.json" --bundle="$bundle_id" --dist=dist

          # Everything else, with revalidation and stale files removed. The bundles, the pointer, the rollback copies and the domain index are not this sync's:
          # old bundle directories must survive --delete while a reader or a rollback may still need them, and the two mutable commit markers move last.
          aws s3 sync dist "s3://$bucket" --only-show-errors --delete \
            --exclude 'assets/*' --exclude '_next/static/*' --exclude 'results/pii-support-matrix-v2-*.json' \
            --exclude 'results/evaluation-bundles/*' --exclude 'results/evaluation-bundle-v1.json' --exclude 'results/rollback/*' \
            --exclude 'results/evaluation-domains-v2.json' --cache-control 'no-cache'
          aws s3 sync dist/_next/static "s3://$bucket/_next/static" --only-show-errors --delete \
            --cache-control 'public, max-age=31536000, immutable'
          # The legacy build's fingerprinted assets, kept through the HTML swap above and removed now that no HTML names them.
          # Empty (a no-op) once the first root publish has run.
          aws s3 rm "s3://$bucket/assets/" --recursive --only-show-errors

          # Rollback copies of the live pointer and index, taken before they move (skipped when this bundle is already live, so a re-run never overwrites the rollback target).
          if [ -n "$previous_id" ] && [ "$previous_id" != "$bundle_id" ]; then
            aws s3 cp "$RUNNER_TEMP/previous-pointer.json" "s3://$bucket/results/rollback/evaluation-bundle-v1.json" --only-show-errors --cache-control 'no-cache'
            aws s3 cp "$RUNNER_TEMP/previous-index.json" "s3://$bucket/results/rollback/evaluation-domains-v2.json" --only-show-errors --cache-control 'no-cache'
          fi
          # The pointer, then the v2 index, are the sole mutable commit markers and are always last. Each is one object replaced atomically by S3, but the two
          # are separate objects: a reader that sees the new pointer with the old index refuses the mismatch (check-evaluation-bundle-publication) instead of combining them.
          aws s3 cp dist/results/evaluation-bundle-v1.json "s3://$bucket/results/evaluation-bundle-v1.json" \
            --only-show-errors --cache-control 'no-cache'
          aws s3 cp dist/results/evaluation-domains-v2.json "s3://$bucket/results/evaluation-domains-v2.json" \
            --only-show-errors --cache-control 'no-cache'
          {
            echo "bucket=$bucket"
            echo "bundle-id=$bundle_id"
            echo "previous-id=$previous_id"
          } >> "$GITHUB_OUTPUT"

          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' \
            --query 'Invalidation.Id' --output text

      # Retention (#791), a separate explicit step after the commit and the invalidation: keep the bundle just published and the one that was live before it
      # (the rollback target), prune the rest. The live pointer is read again, and the planner refuses to prune anything it names or the current bundle.
      - name: Prune evaluation bundles beyond the current and the previous one
        env:
          BUCKET: ${{ steps.publish.outputs.bucket }}
          BUNDLE_ID: ${{ steps.publish.outputs.bundle-id }}
          PREVIOUS_ID: ${{ steps.publish.outputs.previous-id }}
        run: |
          set -euo pipefail
          # The live pointer is read over HTTPS (the role cannot read objects). A cached older pointer only names the previous bundle, which is kept anyway.
          origin="https://$([ "$TARGET" = production ] && echo benchmarks.redactsecret.dev || echo staging.benchmarks.redactsecret.dev)"
          live_id=$(curl --fail --silent --show-error "$origin/results/evaluation-bundle-v1.json" | jq -r .bundleId)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix results/evaluation-bundles/ --delimiter / \
            --query 'CommonPrefixes[].Prefix' --output json | jq -r '.[]?' > "$RUNNER_TEMP/present-bundles.txt"
          node --import tsx scripts/evaluation-bundle-retention.mjs --present="$RUNNER_TEMP/present-bundles.txt" \
            --current="$BUNDLE_ID" --previous="$PREVIOUS_ID" --live="$live_id" | tee "$RUNNER_TEMP/retention-plan.txt"
          while read -r action id; do
            if [ "$action" = prune ]; then aws s3 rm "s3://$BUCKET/results/evaluation-bundles/$id/" --recursive --only-show-errors; fi
          done < "$RUNNER_TEMP/retention-plan.txt"

      - name: Record what was published
        env:
          PRODUCT_COMMIT: ${{ steps.product.outputs.sha }}
          QUALIFICATION_RUN_URL: ${{ steps.product.outputs.run-url }}
          PREVIOUS_BUNDLE: ${{ steps.publish.outputs.previous-id }}
        run: |
          {
            echo "### Published to $TARGET"
            echo
            echo "- benchmarks commit: \`${{ github.sha }}\`"
            echo "- run id: $(jq -r .runId public/results/run.json)"
            echo "- redact-secret measured: $(jq -r '.scannerVersions["redact-secret"] + (if .candidate then " (candidate " + .candidate.sourceCommit[0:7] + ", unreleased)" else " (released)" end)' public/results/run.json)"
            bundle_id=$(jq -r .bundleId public/results/evaluation-bundle-v1.json)
            bundle="public/results/evaluation-bundles/$bundle_id"
            echo "- evaluation bundle \`$bundle_id\`: $(jq -r '"\(.totals.cases) cases, \(.totals.reviews) reviews in \(.cases | length) case parts and \(.reviews | length) review parts"' "$bundle/manifest.json"); previous live bundle \`${PREVIOUS_BUNDLE:-none}\` kept for rollback"
            echo "- qualification: $(jq -r '.report.qualification.status + " with redact-secret " + (.report.qualification.holdout.scanners[] | select(.id == "redact-secret") | .version)' "$bundle/summary.json")"
            echo "- support matrix: $(jq -r '.distribution.stable|tostring' public/results/support-matrix-v1.json) stable, $(jq -r 'if .sourceReport.product then "candidate " + .sourceReport.product.sourceCommit[0:7] else "released " + (.sourceReport.publishedPackage.version // "package") end' public/results/support-matrix-v1.json)"
            echo "- site root (Next export at /, measured files at /results/): $(find dist -type f | wc -l) files; qualification view $(jq -r '.distribution.stable|tostring' public/results/qualification-v1.json) stable, policy \`$(jq -r .policy.revision public/results/qualification-v1.json)\`, official run artifacts checked against benchmarks/official-runs.json"
            pii_artifact=$(jq -r '.domains[] | select(.domain=="pii") | .support.href | ltrimstr("/")' public/results/evaluation-domains-v2.json)
            echo "- PII populations: $(jq -r '[.populationComparisons[] | .id + "=" + .verdict] | join(", ")' "public/$pii_artifact")"
            if [ "$TARGET" = staging ]; then
              echo "- candidate evidence for redact-secret \`$PRODUCT_COMMIT\` ($(jq -r .status public/results/candidate-evidence-v1.json)), artifacts from $QUALIFICATION_RUN_URL"
            else
              echo "- published product version: \`$(jq -r .pins.packageVersion benchmarks/pin-manifest.json)\`"
              echo "- product release source SHA: \`$(jq -r .pins.releaseSourceRevision benchmarks/pin-manifest.json)\`"
              echo "- benchmark snapshot SHA: \`${{ github.sha }}\`"
              echo "- corpus manifest hash: \`$(jq -r .revision benchmarks/pin-manifest.json)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
