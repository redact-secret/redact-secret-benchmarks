name: Validate benchmark sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures:check
      - run: npm test
      - name: Validate published engine qualification evidence
        run: npm run eval:validate -- docs/qualification/engine-v1.json
      - name: Exercise evaluation engine with the published npm scanner
        run: npm run eval -- --scanner=redact-secret
      - run: npm run build
      - name: Generated inputs must not change tracked files
        run: git diff --exit-code
