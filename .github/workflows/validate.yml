name: Validate benchmark sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # `validate` is the required status check and keeps its name: it is the
  # aggregate of `validate-sources` (everything but `npm test`) and the
  # `unit-tests` shards, which run in parallel instead of serially (#479 P3).
  validate:
    if: always()
    needs: [validate-sources, unit-tests, web]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SOURCES: ${{ needs.validate-sources.result }}
      TESTS: ${{ needs.unit-tests.result }}
      WEB: ${{ needs.web.result }}
    steps:
      - run: |
          echo "validate-sources: $SOURCES; unit-tests: $TESTS; web: $WEB"
          [ "$SOURCES" = success ] && [ "$TESTS" = success ] && [ "$WEB" = success ]

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      # Same command as `npm test`, sharded by file; --test-shard must precede the file list.
      - run: node --import tsx --test --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs

  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures:check
      - name: Fixture semantic index is complete, reviewed, and current (#340)
        run: npm run fixture-index:check
      - name: Validate published engine qualification evidence (frozen Beta.11 report, against the suite snapshot it was produced with)
        run: npm run eval:validate -- docs/specs/qualification/engine-v1.json --suite=evidence/449/suite-v1.json
      - name: Exercise evaluation engine with the published npm scanner
        run: npm run eval -- --scanner=redact-secret
      - name: The UI carries no support status the generated matrix cannot
        run: npm run support:check:ui
      - name: No detector family arrives without its required evidence (#52)
        run: npm run arrival:check
      - name: Fixture profile coverage report and spec table match the corpus (#206)
        run: npm run profiles:check
      - name: Every ADR has valid frontmatter and is indexed exactly once (#135)
        run: npm run decisions:validate
      - name: Every qualification input population has an owner, run class, denominator and pin (#603)
        run: npm run qualification-inputs:check
      - name: The official-run registry pins the engine, scanners and population evidence, and every recorded run matches (#604)
        run: npm run official-runs:check
      - name: The qualification authority is one valid committed value, and the new path is still authorised when it is the authority (#608)
        run: npm run authority:check
      - name: Every taxonomy provider and family has a dossier entry (#473)
        run: npm run dossiers:check
      - name: Peer scanner rules map to real taxonomy families, and the peer registry ranks nothing (#558)
        run: npm run peer-rules:check
      - name: Contribution readiness next actions, advisory only (#534)
        # Aggregates the validators above into a step summary. Non-blocking, no
        # new job, and no PR-controlled input reaches the shell: the command and
        # its arguments are fixed.
        continue-on-error: true
        run: npm run --silent contribution:readiness >> "$GITHUB_STEP_SUMMARY"
      - name: Performance criteria are derived from the committed release-build evidence, and its schema pin has not drifted (#136)
        run: npm run performance:criteria:check && npm run performance:schema:check
      - name: Regression budgets match their derivation, baselines are unchanged, and no breach was replaced away (#143)
        run: npm run performance:budgets:check
      - name: No not-assertable ledger entry lacks a checked-in ADR decision (#63)
        run: npm run ledger:decisions:check
      - name: Review ledger provenance and decision categories are valid (#341)
        run: npm run ledger:provenance:check
      - name: External adversarial packs satisfy the intake contract, first runs are immutable, and no project-authored evidence is called independent (#139)
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true
          npm run adversarial:check
      - name: Statistical scorer tuning manifests keep protected holdout out of tuning (#256)
        run: npm run tuning:check
      - name: The statistical scorer's future-promotion contract answers Q1-Q5 with hard constraints and no mixed score (#257)
        run: npm run scorer-promotion:check
      - run: npm run build
      - name: No candidate-level feature vector or calibration boundary detail reaches public/ or the built site (#254, #255)
        run: npm run features:check-public
      - name: No custodian-held blind corpus, freeze or ledger is tracked or published, and every blind aggregate passes the release whitelist (#142)
        run: npm run blind:check-public
      - name: Pin manifest reflects the current pins, corpus hashes, and fixture list
        run: npm run pins:manifest:check
      - name: docs/generated/release-comparison.md matches baselines/*.json
        run: npm run baseline:report
      - name: T3 (project policy) carries no peer column in the default-mode comparison (#404)
        run: npm run baseline:check-t3
      - name: Generated inputs must not change tracked files
        run: git diff --exit-code

  # The redesigned site (#547): a self-contained package in web/ with its own
  # lockfile. It builds to web/out and web/storybook-static, never to dist/. publish-site.yml
  # builds its own export (with the qualification view, #602) and publishes it under /next/ only.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # The web services read the fixture corpora and the benchmark run, as the existing site does (#556).
      # `npm ci` materialises the generated corpora (prepare); the bench takes about 15 seconds.
      - name: Repository dependencies, generated fixtures, one benchmark run for the report pages and one evaluation for the evaluation pages
        # The evaluation pages (#614) read public/results/evaluation-v1.json. With the product alone the run takes under a minute
        # and has no peer, so the pages are built in the state a checkout without peers has; a full evaluation is published by publish-site.
        run: |
          npm ci
          npm run bench
          npm run eval:discover -- --scanner=redact-secret
          npm run eval:publish
      - name: No sx prop, no styled(), fetch only of build-emitted data through one helper, CSS Modules layered (#547, #573)
        run: npm run check:no-sx
        working-directory: web
      - name: Header uses the canonical logo files and tokens only (#554)
        run: npm run check:header
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # The committed qualification authority (#608) is `new`, and CI has no qualification view (it is derived from the manual official
      # runs, never committed), so the credential pages as committed have no data to test in a browser. The browser checks below
      # therefore run on the export of the legacy pipeline, built by flipping the one committed value in this runner's checkout only
      # (web/scripts/with-authority.mjs restores it): the oracle and rollback state stays built and tested on every change. The
      # committed state is built and recounted at the end of this job.
      - name: Static export of the legacy pipeline (the oracle) builds and contains the six routes (#547, #608)
        run: node scripts/with-authority.mjs legacy -- sh -c 'npm run build && npm run check:routes'
        working-directory: web
        env:
          WEB_REQUIRE_RUN: '1'
      # Unit and component tests (#598): Vitest with V8 coverage over web/app, components, lib, resolvers,
      # services and theme. Fails below 80% of lines, statements, functions or branches (vitest.config.mts).
      # The services read the corpora and the run installed above; the resolver suites that used to run in
      # the root unit-tests job run here, where their coverage is counted.
      - name: Unit and component tests, at least 80% of lines, statements, functions and branches (#598)
        run: npm run test:coverage
        working-directory: web
      - name: Coverage by directory
        if: always() && hashFiles('web/coverage/coverage-summary.json') != ''
        run: npm run coverage:summary
        working-directory: web
      - name: Coverage report (lcov and HTML)
        if: always() && hashFiles('web/coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 14
      - name: Storybook builds on the Next.js framework (#547)
        run: npm run build-storybook
        working-directory: web
      - name: Chromium for the layout check and the Playwright suite (#554, #598)
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The Playwright suite (#598) drives the export check:routes just built. check:layout below runs
      # one browser with a page per core it can have (3 on a 4 vCPU runner: it leaves the suite's 2 workers
      # a share), so the suite starts first in the background and is joined after it; its exit status and log are kept in RUNNER_TEMP, and a failing run uploads its traces.
      - name: Playwright suite over the export, started in the background (#598)
        run: |
          rm -f "$RUNNER_TEMP/e2e.status"
          touch "$RUNNER_TEMP/e2e.started"
          nohup bash -c "npm run test:e2e; echo \$? > \"$RUNNER_TEMP/e2e.status\"" > "$RUNNER_TEMP/e2e.log" 2>&1 &
        working-directory: web
        env:
          PW_WORKERS: '2'
      - name: No page overflow, no mid-word breaks and no shift when data loads, at 320, 375 and 768px in any story, page or loading or error state (#554, #573)
        run: npm run check:layout
        working-directory: web
      - name: Playwright suite results (every route in both themes at 320 and 1280px with axe, navigation, URL state, data states, theme, keyboard, reduced motion, no script)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/e2e.started" ] || { echo 'The Playwright suite did not start (an earlier step failed).'; exit 0; }
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/e2e.status" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/e2e.log"
          [ "$(cat "$RUNNER_TEMP/e2e.status" 2>/dev/null)" = "0" ]
      - name: The committed authority builds as committed and says what it has, with no qualification view (#608)
        # Last, because it replaces the export the browser checks above ran on. Without a view every credential report page names the
        # new pipeline and says no view backs the build; check:routes recounts exactly that. WEB_REQUIRE_QUALIFICATION is set by a workflow
        # that publishes the new pipeline, where a missing view must fail the build instead.
        run: npm run build && npm run check:routes
        working-directory: web
        env:
          WEB_REQUIRE_RUN: '1'
      - name: Playwright traces of the failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-playwright-failures
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  pin-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry, inventory, and known-gap commits must trace to the product's main
        run: npm run pins:check
      - name: Every product promotion cross-references a lifecycle record, and vice versa (#106)
        run: npm run promotion:check

  scanner-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ordinary validation intentionally has no peer binaries on PATH. Both
      # commands must fail closed unless every committed observation matches
      # the current corpus, semantic index, pin, adapter and snapshot schema.
      - name: Support classification reuses validated peer observations
        run: npm run eval:classify
      - name: Every review-queue id resolves against the ledger, using the same validated observations (#98)
        run: npm run queue:check
      - name: Run the comparison with a fresh product and validated peer observations
        run: npm run bench -- --strict
      - name: Record which redact-secret artifact was measured
        if: always()
        run: |
          {
            echo "### Four-scanner comparison"
            echo "- redact-secret: published npm package \`@redact-secret/core@$(node -p "require('./package.json').dependencies['@redact-secret/core']")\`, not a candidate build of the product's \`main\`"
            echo "- peers: validated normalized snapshots (source run, observed time, input identity and digest retained in every row); no peer binary provisioned or executed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the four-scanner comparison results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: four-scanner-comparison
          path: public/results/
          retention-days: 90
