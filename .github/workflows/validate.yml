name: Validate benchmark sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures:check
      - name: Fixture semantic index is complete, reviewed, and current (#340)
        run: npm run fixture-index:check
      - run: npm test
      - name: Validate published engine qualification evidence
        run: npm run eval:validate -- docs/specs/qualification/engine-v1.json
      - name: Exercise evaluation engine with the published npm scanner
        run: npm run eval -- --scanner=redact-secret
      - name: The UI carries no support status the generated matrix cannot
        run: npm run support:check:ui
      - name: No detector family arrives without its required evidence (#52)
        run: npm run arrival:check
      - name: Fixture profile coverage report and spec table match the corpus (#206)
        run: npm run profiles:check
      - name: Every ADR has valid frontmatter and is indexed exactly once (#135)
        run: npm run decisions:validate
      - name: Performance criteria are derived from the committed release-build evidence, and its schema pin has not drifted (#136)
        run: npm run performance:criteria:check && npm run performance:schema:check
      - name: Regression budgets match their derivation, baselines are unchanged, and no breach was replaced away (#143)
        run: npm run performance:budgets:check
      - name: No not-assertable ledger entry lacks a checked-in ADR decision (#63)
        run: npm run ledger:decisions:check
      - name: External adversarial packs satisfy the intake contract, first runs are immutable, and no project-authored evidence is called independent (#139)
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true
          npm run adversarial:check
      - name: Statistical scorer tuning manifests keep protected holdout out of tuning (#256)
        run: npm run tuning:check
      - name: The statistical scorer's future-promotion contract answers Q1-Q5 with hard constraints and no mixed score (#257)
        run: npm run scorer-promotion:check
      - run: npm run build
      - name: No candidate-level feature vector or calibration boundary detail reaches public/ or the built site (#254, #255)
        run: npm run features:check-public
      - name: No custodian-held blind corpus, freeze or ledger is tracked or published, and every blind aggregate passes the release whitelist (#142)
        run: npm run blind:check-public
      - name: Pin manifest reflects the current pins, corpus hashes, and fixture list
        run: npm run pins:manifest:check
      - name: docs/generated/release-comparison.md matches baselines/*.json
        run: npm run baseline:report
      - name: Generated inputs must not change tracked files
        run: git diff --exit-code

  pin-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry, inventory, and known-gap commits must trace to the product's main
        run: npm run pins:check
      - name: Every product promotion cross-references a lifecycle record, and vice versa (#106)
        run: npm run promotion:check

  scanner-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision checksum-pinned Gitleaks and TruffleHog (versions from qualification/suite-v1.json, digests from scanners/peer-checksums.json)
        run: npm run peers:provision -- --dir "$RUNNER_TEMP/scanner-bin"
      - name: Verify the resolved peers are the pinned ones
        run: |
          set -euo pipefail
          [ "$(command -v gitleaks)" = "$RUNNER_TEMP/scanner-bin/gitleaks" ]
          [ "$(command -v trufflehog)" = "$RUNNER_TEMP/scanner-bin/trufflehog" ]
      - name: Real-binary integration tests for all external adapters
        run: npm run test:integration
      - name: Every review-queue id resolves against the ledger, or is deliberately open (#98)
        run: npm run queue:check
      - name: Support classification runs against the pinned peers
        run: npm run eval:classify
      - name: Run the full four-scanner comparison
        run: npm run bench -- --strict
      - name: Record which redact-secret artifact was measured
        if: always()
        run: |
          {
            echo "### Four-scanner comparison"
            echo "- redact-secret: published npm package \`@redact-secret/core@$(node -p "require('./package.json').dependencies['@redact-secret/core']")\`, not a candidate build of the product's \`main\`"
            echo "- gitleaks \`$(node -p "require('./qualification/suite-v1.json').scanners.gitleaks")\` and trufflehog \`$(node -p "require('./qualification/suite-v1.json').scanners.trufflehog")\` (checksum-verified against scanners/peer-checksums.json; digests in the provisioning summary above) - flare-redact \`$(node -p "require('./package.json').dependencies['flare-redact']")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the four-scanner comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-scanner-comparison
          path: public/results/
          retention-days: 90
