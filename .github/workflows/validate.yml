name: Validate benchmark sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures:check
      - run: npm test
      - name: Validate published engine qualification evidence
        run: npm run eval:validate -- docs/qualification/engine-v1.json
      - name: Exercise evaluation engine with the published npm scanner
        run: npm run eval -- --scanner=redact-secret
      - name: The UI carries no support status the generated matrix cannot
        run: npm run support:check:ui
      - name: No detector family arrives without its required evidence (#52)
        run: npm run arrival:check
      - name: No not-assertable ledger entry lacks a checked-in ADR decision (#63)
        run: npm run decisions:validate
      - run: npm run build
      - name: Pin manifest reflects the current pins, corpus hashes, and fixture list
        run: npm run pins:manifest:check
      - name: Generated inputs must not change tracked files
        run: git diff --exit-code

  pin-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry, inventory, and known-gap commits must trace to the product's main
        run: npm run pins:check
      - name: Every product promotion cross-references a lifecycle record, and vice versa (#106)
        run: npm run promotion:check

  scanner-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      TRUFFLEHOG_VERSION: 3.97.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Gitleaks and TruffleHog releases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-bin"
          cd "$RUNNER_TEMP/scanner-bin"

          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

          curl -sSL -O "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSL -O "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          grep " trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz\$" "trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" trufflehog

          chmod +x gitleaks trufflehog
          echo "$RUNNER_TEMP/scanner-bin" >> "$GITHUB_PATH"
      - name: Verify installed binaries self-report the pinned versions
        run: |
          set -euo pipefail
          actual_gitleaks="$(gitleaks version)"
          if [ "$actual_gitleaks" != "$GITLEAKS_VERSION" ]; then
            echo "::error::Gitleaks reports '$actual_gitleaks', expected '$GITLEAKS_VERSION' -- a silently upgraded binary would change published numbers"
            exit 1
          fi
          actual_trufflehog="$(trufflehog --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ "$actual_trufflehog" != "$TRUFFLEHOG_VERSION" ]; then
            echo "::error::TruffleHog reports '$actual_trufflehog', expected '$TRUFFLEHOG_VERSION' -- a silently upgraded binary would change published numbers"
            exit 1
          fi
      - name: Real-binary integration tests for all external adapters
        run: npm run test:integration
      - name: Every review-queue id resolves against the ledger, or is deliberately open (#98)
        run: npm run queue:check
      - name: Run the full four-scanner comparison
        run: npm run bench -- --strict
      - name: Record which redact-secret artifact was measured
        if: always()
        run: |
          {
            echo "### Four-scanner comparison"
            echo "- redact-secret: published npm package \`@redact-secret/core@$(node -p "require('./package.json').dependencies['@redact-secret/core']")\`, not a candidate build of the product's \`main\`"
            echo "- gitleaks \`$GITLEAKS_VERSION\` (self-reported and checksum-verified) - trufflehog \`$TRUFFLEHOG_VERSION\` (self-reported and checksum-verified) - flare-redact \`$(node -p "require('./package.json').dependencies['flare-redact']")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the four-scanner comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-scanner-comparison
          path: public/results/
          retention-days: 90
